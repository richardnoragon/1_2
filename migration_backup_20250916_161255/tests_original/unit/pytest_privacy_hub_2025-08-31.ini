[tool:pytest]
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --html=results/result_privacy_hub_2025-08-31_report.html
    --json-report
    --json-report-file=results/result_privacy_hub_2025-08-31_results.json
    --junit-xml=results/result_privacy_hub_2025-08-31_junit.xml
    --cov=src.utilities.privacy.privacy_tools.gui.privacy_hub
    --cov-report=html:results/result_privacy_hub_2025-08-31_coverage
    --cov-report=json:results/result_privacy_hub_2025-08-31_coverage.json
    --cov-report=term-missing
    --cov-fail-under=80

testpaths = .
python_files = test_privacy_hub_2025-08-31.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    gui: GUI tests requiring display
    mock: Tests using mocks

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

minversion = 6.0

collect_ignore = [
    "setup.py",
    "conftest.py"
]

timeout = 300
timeout_method = thread

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
[coverage:run]
source = src/utilities/privacy/privacy_tools/gui/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    pass

[coverage:html]
directory = results/result_privacy_hub_2025-08-31_coverage
title = Privacy Hub Test Coverage Report