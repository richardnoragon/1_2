[tool:pytest]
# Enhanced Editor Test Configuration
# Generated: 2025-08-31
# Target: enhanced_editor.py

minversion = 6.0
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --html=result_enhanced_editor_2025-08-31.html
    --self-contained-html
    --json-report
    --json-report-file=result_enhanced_editor_2025-08-31.json
    --cov=src.utilities.file_operations.enhanced_editor.enhanced_editor
    --cov-report=html:result_enhanced_editor_coverage_2025-08-31
    --cov-report=json:result_enhanced_editor_coverage_2025-08-31.json
    --cov-report=xml:result_enhanced_editor_coverage_2025-08-31.xml
    --cov-report=term-missing
    --cov-fail-under=0
    --junit-xml=result_enhanced_editor_junit_2025-08-31.xml
    --durations=10

testpaths = 
    tests/unit

python_files = test_enhanced_editor_2025-08-31.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    edge_case: Edge case tests
    error_condition: Error condition tests

# Coverage settings
[tool:coverage:run]
source = src/utilities/file_operations/enhanced_editor/
omit = 
    tests/*
    */__pycache__/*
    */venv/*
    */env/*

[tool:coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[tool:coverage:html]
directory = result_enhanced_editor_coverage_2025-08-31

[tool:coverage:xml]
output = result_enhanced_editor_coverage_2025-08-31.xml

[tool:coverage:json]
output = result_enhanced_editor_coverage_2025-08-31.json