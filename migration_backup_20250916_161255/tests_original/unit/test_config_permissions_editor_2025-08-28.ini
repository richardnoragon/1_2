[tool:pytest]
testpaths = tests/unit
python_files = test_permissions_editor_*2025-08-28.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --html=tests/unit/result_permissions_editor_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_permissions_editor_2025-08-28.json
    --cov=src/utilities/system/permissions_editor
    --cov-report=html:tests/unit/result_permissions_editor_coverage_2025-08-28
    --cov-report=xml:tests/unit/result_permissions_editor_coverage_2025-08-28.xml
    --cov-report=term-missing
    --cov-fail-under=85
    --maxfail=10

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    gui: marks tests as GUI tests
    platform: marks tests as platform-specific tests
    permissions: marks tests as permission-related tests
    file_operations: marks tests as file operation tests
    ui: marks tests as user interface tests
    security: marks tests as security-related tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Collection settings
collect_ignore = [
    "setup.py",
    "build/",
    "dist/",
    "__pycache__/",
    ".git/",
    ".pytest_cache/"
]

# Minimum version requirements
minversion = 6.0

# Test discovery patterns
testpaths = tests/unit
norecursedirs = .git .pytest_cache __pycache__ build dist

# Timeout settings (if pytest-timeout is available)
timeout = 300

# Coverage settings
[coverage:run]
source = src/utilities/system/permissions_editor
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */.*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = true
precision = 2

[coverage:html]
directory = tests/unit/result_permissions_editor_coverage_2025-08-28
title = Permissions Editor Test Coverage Report

[coverage:xml]
output = tests/unit/result_permissions_editor_coverage_2025-08-28.xml