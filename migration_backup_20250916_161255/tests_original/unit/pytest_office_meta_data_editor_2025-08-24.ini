[tool:pytest]
# Pytest configuration for office_meta_data_editor.py testing

# Test discovery
python_files = test_office_meta_data_editor_2025-08-24.py
python_classes = Test*
python_functions = test_*
testpaths = C:\Users\HP1\1_2\1_2\tests\unit

# Coverage settings
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src.utilities.metadata.office_meta_data_editor
    --cov-report=term-missing
    --cov-report=html:tests/unit/result_office_meta_data_editor_coverage_2025-08-24
    --cov-report=json:tests/unit/result_office_meta_data_editor_coverage_2025-08-24.json
    --cov-branch
    --cov-fail-under=85

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    gui: GUI component tests
    metadata: Metadata processing tests
    worker: Worker thread tests
    file_operations: File operation tests
    edge_cases: Edge case tests

# Minimum version requirements
minversion = 6.0

# Test session configuration
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout settings
timeout = 300
timeout_method = thread

# xdist settings for parallel execution
addopts = --numprocesses=auto