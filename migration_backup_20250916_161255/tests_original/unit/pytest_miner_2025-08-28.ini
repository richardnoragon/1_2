[tool:pytest]
minversion = 6.0
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --html=result_miner_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_miner_2025-08-28.json
    --cov=src.utilities.pdf_tools.pdf_view_analysis.miner
    --cov-report=html:coverage_miner_2025-08-28/
    --cov-report=json:result_miner_coverage_2025-08-28.json
    --cov-report=term-missing
    --cov-fail-under=85
    --maxfail=5
    --durations=10
    --junit-xml=result_miner_2025-08-28.xml

testpaths = 
    tests/unit

python_files = 
    test_miner_2025-08-28.py

python_classes = 
    Test*

python_functions = 
    test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests that require GUI components
    pdf: marks tests related to PDF functionality

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest_miner_2025-08-28.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S