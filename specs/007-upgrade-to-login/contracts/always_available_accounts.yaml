# Always-Available Accounts Contract

openapi: 3.0.3
info:
  title: Always-Available Accounts API
  version: 1.0.0
  description: |
    Contracts for always-available account protection and auto-unblock mechanism.
    These accounts ensure operators are never completely locked out of the system.

paths:
  /internal/accounts/always-available:
    get:
      operationId: listAlwaysAvailableAccounts
      summary: List all always-available accounts
      description: Returns accounts with is_always_available=true flag
      responses:
        "200":
          description: List of protected accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlwaysAvailableAccount"

  /internal/accounts/{username}/protect:
    post:
      operationId: protectAccount
      summary: Mark account as always-available (dev role only)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account protected
        "403":
          description: Insufficient privileges (requires dev role)
        "404":
          description: Account not found
        "409":
          description: Account is already break-glass type

  /internal/accounts/{username}/delete:
    delete:
      operationId: deleteAccount
      summary: Delete account (blocked for always-available)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account deleted
        "403":
          description: Cannot delete always-available account
        "404":
          description: Account not found

  /internal/accounts/{username}/auto-unblock:
    post:
      operationId: checkAutoUnblock
      summary: Check and perform auto-unblock if cooldown expired
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auto-unblock result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoUnblockResult"
        "404":
          description: Account not found or not always-available

components:
  schemas:
    AlwaysAvailableAccount:
      type: object
      required:
        - username
        - role
        - is_blocked
        - cooldown_config
      properties:
        username:
          type: string
        role:
          type: string
          enum: [dev, admin]
        is_blocked:
          type: boolean
        cooldown_config:
          $ref: "#/components/schemas/CooldownConfig"

    CooldownConfig:
      type: object
      required:
        - cooldown_duration_minutes
        - auto_unblock_enabled
      properties:
        last_cooldown_start:
          type: string
          format: date-time
          nullable: true
        cooldown_duration_minutes:
          type: integer
          default: 5
          minimum: 1
        auto_unblock_enabled:
          type: boolean
          default: true

    AutoUnblockResult:
      type: object
      required:
        - username
        - was_blocked
        - unblocked
      properties:
        username:
          type: string
        was_blocked:
          type: boolean
        unblocked:
          type: boolean
        reason:
          type: string
          description: Why unblock did/didn't happen

# Contract Tests (pytest assertions)
x-contract-tests:
  - name: test_cannot_delete_always_available_account
    given:
      - Account 'rfu_admin_always' exists with is_always_available=true
    when:
      - DELETE /internal/accounts/rfu_admin_always/delete
    then:
      - Response status is 403
      - Account still exists in database
      - AdminActionAudit logged with action_type='delete_attempt_blocked'

  - name: test_cannot_disable_always_available_account
    given:
      - Account 'rfu_dev_always' exists with is_always_available=true
    when:
      - PATCH /internal/accounts/rfu_dev_always with account_status='disabled'
    then:
      - Response status is 403
      - Account status remains 'active'
      - AdminActionAudit logged with action_type='disable_attempt_blocked'

  - name: test_auto_unblock_after_cooldown
    given:
      - Account 'rfu_admin_always' is blocked
      - last_cooldown_start was 6 minutes ago
      - cooldown_duration_minutes is 5
    when:
      - POST /internal/accounts/rfu_admin_always/auto-unblock
    then:
      - Response unblocked is true
      - Account is_blocked is now false
      - login_attempts reset to 0
      - AdminActionAudit logged with action_type='auto_unblock'

  - name: test_no_auto_unblock_during_cooldown
    given:
      - Account 'rfu_admin_always' is blocked
      - last_cooldown_start was 2 minutes ago
      - cooldown_duration_minutes is 5
    when:
      - POST /internal/accounts/rfu_admin_always/auto-unblock
    then:
      - Response unblocked is false
      - Account is_blocked remains true
      - Response reason contains 'cooldown not expired'
