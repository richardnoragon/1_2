# Lockout Prevention Contract

openapi: 3.0.3
info:
  title: Lockout Prevention API
  version: 1.0.0
  description: |
    Contracts ensuring the system never reaches a state where all administrative
    access is blocked. Defines the invariant and verification mechanisms.

paths:
  /internal/health/lockout-prevention:
    get:
      operationId: checkLockoutPreventionHealth
      summary: Verify lockout prevention invariant holds
      description: |
        Returns health status of lockout prevention mechanisms.
        Should always return healthy unless critical system failure.
      responses:
        "200":
          description: Invariant holds - system has accessible admin path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockoutPreventionHealth"
        "503":
          description: Critical - no accessible admin path (should never happen)

  /internal/recovery/cli-path:
    get:
      operationId: getCLIRecoveryPath
      summary: Get CLI-accessible recovery instructions
      description: |
        Returns instructions for headless recovery without GUI.
        Always accessible even when GUI is unavailable.
      responses:
        "200":
          description: Recovery instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLIRecoveryPath"

  /internal/bootstrap/protected-accounts:
    post:
      operationId: bootstrapProtectedAccounts
      summary: Initialize always-available and break-glass accounts
      description: |
        Called during database initialization to create protected accounts.
        Idempotent - safe to call multiple times.
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResult"

components:
  schemas:
    LockoutPreventionHealth:
      type: object
      required:
        - healthy
        - always_available_accounts
        - break_glass_accounts
        - accessible_paths
      properties:
        healthy:
          type: boolean
        always_available_accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountHealth"
        break_glass_accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountHealth"
        accessible_paths:
          type: array
          items:
            type: string
          description: List of currently accessible recovery paths
        last_check:
          type: string
          format: date-time

    AccountHealth:
      type: object
      required:
        - username
        - role
        - is_accessible
      properties:
        username:
          type: string
        role:
          type: string
          enum: [dev, admin]
        is_accessible:
          type: boolean
        blocked_reason:
          type: string
          nullable: true
        will_auto_unblock_at:
          type: string
          format: date-time
          nullable: true

    CLIRecoveryPath:
      type: object
      required:
        - available
        - commands
      properties:
        available:
          type: boolean
        commands:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryCommand"
        rescue_script_path:
          type: string
          description: Path to rescue.py for direct DB access

    RecoveryCommand:
      type: object
      required:
        - name
        - command
        - description
      properties:
        name:
          type: string
        command:
          type: string
        description:
          type: string
        requires_break_glass:
          type: boolean
          default: false

    BootstrapResult:
      type: object
      required:
        - success
        - accounts_created
      properties:
        success:
          type: boolean
        accounts_created:
          type: array
          items:
            $ref: "#/components/schemas/CreatedAccount"
        credentials_file:
          type: string
          description: Path to secure note with initial credentials
        console_output_shown:
          type: boolean

    CreatedAccount:
      type: object
      required:
        - username
        - role
        - account_type
      properties:
        username:
          type: string
        role:
          type: string
          enum: [dev, admin]
        account_type:
          type: string
          enum: [always_available, break_glass]
        temporary_password_displayed:
          type: boolean

# Lockout Prevention Invariant
x-invariant:
  name: never_fully_locked_out
  description: |
    The system MUST always have at least one accessible administrative path.
    This is enforced through multiple fallback layers:
    1. Always-available accounts (auto-unblock after cooldown)
    2. Break-glass accounts (manual enablement for emergency)
    3. Direct DB rescue script (last resort)

  verification:
    - At least one always-available dev account exists
    - At least one always-available admin account exists
    - At least one break-glass dev account exists
    - At least one break-glass admin account exists
    - If always-available accounts are blocked, cooldown will expire
    - Break-glass credentials exist in offline storage

# Contract Tests (pytest assertions)
x-contract-tests:
  - name: test_invariant_holds_with_healthy_accounts
    given:
      - Always-available accounts exist and are active
      - Break-glass accounts exist
    when:
      - GET /internal/health/lockout-prevention
    then:
      - Response healthy is true
      - accessible_paths contains at least one path

  - name: test_invariant_holds_with_blocked_always_available
    given:
      - Always-available admin account is blocked
      - Cooldown started 2 minutes ago (will auto-unblock in 3 min)
      - Always-available dev account is active
    when:
      - GET /internal/health/lockout-prevention
    then:
      - Response healthy is true
      - Admin account shows will_auto_unblock_at
      - Dev account shows is_accessible=true

  - name: test_invariant_holds_with_all_always_available_blocked
    given:
      - Both always-available accounts are blocked
      - Cooldown not yet expired
      - Break-glass accounts exist and are enabled
    when:
      - GET /internal/health/lockout-prevention
    then:
      - Response healthy is true
      - accessible_paths contains 'break_glass'

  - name: test_bootstrap_creates_all_protected_accounts
    given:
      - Fresh database with no accounts
    when:
      - POST /internal/bootstrap/protected-accounts
    then:
      - Response success is true
      - accounts_created has 4 entries
      - Accounts include: rfu_dev_always, rfu_admin_always, rfu_dev_breakglass, rfu_admin_breakglass
      - Credentials displayed via console and saved to file

  - name: test_bootstrap_is_idempotent
    given:
      - Protected accounts already exist
    when:
      - POST /internal/bootstrap/protected-accounts again
    then:
      - Response success is true
      - accounts_created is empty (no duplicates)
      - Existing accounts unchanged

  - name: test_cli_recovery_path_always_available
    given:
      - GUI is unavailable
      - Always-available admin is blocked
    when:
      - GET /internal/recovery/cli-path
    then:
      - Response available is true
      - Commands include 'rfu_admin.py unblock-user'
      - Commands include 'rescue.py rescue'

  - name: test_audit_retention_for_lockout_events
    given:
      - Account lockout event occurred 11 months ago
    when:
      - Query AdminActionAudit for lockout events
    then:
      - Event is still present (retention >= 12 months)
      - Event contains timestamp, actor, target, outcome

  - name: test_cross_recovery_break_glass_can_unblock_always_available
    given:
      - Always-available admin account is blocked
      - Break-glass admin account is enabled and active
    when:
      - Login with break-glass credentials
      - Unblock always-available admin
    then:
      - Unblock succeeds
      - Always-available admin is now active
      - Both actions logged in BreakGlassUsageLog.actions_performed

  - name: test_system_never_deletes_last_admin_path
    given:
      - Only one always-available admin exists
      - Attempt to delete via direct SQL (rescue.py)
    when:
      - Execute deletion
    then:
      - Deletion blocked at application layer
      - If bypassed via SQL, health check fails with critical alert
