# Break-Glass Accounts Contract

openapi: 3.0.3
info:
  title: Break-Glass Accounts API
  version: 1.0.0
  description: |
    Contracts for break-glass emergency recovery accounts.
    These accounts provide last-resort access when primary accounts are compromised or locked.

paths:
  /internal/break-glass/enable:
    post:
      operationId: enableBreakGlassAccess
      summary: Enable break-glass login capability (requires CLI flag or env var)
      description: |
        Enables break-glass accounts for authentication.
        Must be called before break-glass login will succeed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - enablement_source
              properties:
                enablement_source:
                  type: string
                  enum: [cli_flag, environment_variable]
      responses:
        "200":
          description: Break-glass access enabled
        "403":
          description: Enablement not allowed (missing flag/env var)

  /internal/break-glass/disable:
    post:
      operationId: disableBreakGlassAccess
      summary: Disable break-glass login capability
      responses:
        "200":
          description: Break-glass access disabled

  /auth/login/break-glass:
    post:
      operationId: breakGlassLogin
      summary: Authenticate with break-glass credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - justification
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                justification:
                  type: string
                  minLength: 10
                  description: Required explanation for emergency access
      responses:
        "200":
          description: Break-glass session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSession"
        "401":
          description: Invalid credentials
        "403":
          description: Break-glass access not enabled or account not break-glass type
        "422":
          description: Justification too short or missing

  /auth/logout/break-glass:
    post:
      operationId: breakGlassLogout
      summary: End break-glass session and trigger rotation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: Session ended, rotation triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotationResult"

  /internal/break-glass/usage-log:
    get:
      operationId: getBreakGlassUsageLog
      summary: Get break-glass usage history (dev/admin only)
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: username
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Usage log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakGlassUsageEntry"
        "403":
          description: Insufficient privileges

  /internal/break-glass/pending-rotations:
    get:
      operationId: getPendingRotations
      summary: List break-glass accounts with pending password rotations
      responses:
        "200":
          description: Accounts needing rotation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingRotation"

components:
  schemas:
    BreakGlassSession:
      type: object
      required:
        - session_id
        - username
        - session_type
        - created_at
      properties:
        session_id:
          type: string
        username:
          type: string
        session_type:
          type: string
          enum: [break_glass]
        created_at:
          type: string
          format: date-time
        usage_log_id:
          type: integer

    BreakGlassUsageEntry:
      type: object
      required:
        - id
        - account_username
        - login_timestamp
        - justification
        - post_usage_rotation_status
      properties:
        id:
          type: integer
        session_id:
          type: string
        account_username:
          type: string
        login_timestamp:
          type: string
          format: date-time
        logout_timestamp:
          type: string
          format: date-time
          nullable: true
        justification:
          type: string
        actions_performed:
          type: array
          items:
            $ref: "#/components/schemas/ActionEntry"
        post_usage_rotation_status:
          type: string
          enum: [pending, completed, failed]

    ActionEntry:
      type: object
      required:
        - action
        - timestamp
      properties:
        action:
          type: string
        target:
          type: string
        timestamp:
          type: string
          format: date-time

    RotationResult:
      type: object
      required:
        - session_id
        - rotation_triggered
      properties:
        session_id:
          type: string
        rotation_triggered:
          type: boolean
        new_credentials_file:
          type: string
          description: Path to secure note file with new credentials
        acknowledgment_required:
          type: boolean
          description: Whether dev must acknowledge before sealing

    PendingRotation:
      type: object
      required:
        - username
        - last_usage
        - status
      properties:
        username:
          type: string
        last_usage:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending]
        days_pending:
          type: integer

# Contract Tests (pytest assertions)
x-contract-tests:
  - name: test_break_glass_login_requires_enablement
    given:
      - Break-glass access is disabled
      - Account 'rfu_admin_breakglass' exists with is_break_glass=true
    when:
      - POST /auth/login/break-glass with valid credentials
    then:
      - Response status is 403
      - Error message contains 'break-glass access not enabled'

  - name: test_break_glass_login_requires_justification
    given:
      - Break-glass access is enabled
      - Account 'rfu_admin_breakglass' exists with is_break_glass=true
    when:
      - POST /auth/login/break-glass with credentials but no justification
    then:
      - Response status is 422
      - Error message contains 'justification required'

  - name: test_break_glass_login_creates_usage_log
    given:
      - Break-glass access is enabled
      - Account 'rfu_admin_breakglass' exists with is_break_glass=true
    when:
      - POST /auth/login/break-glass with valid credentials and justification
    then:
      - Response status is 200
      - session_type is 'break_glass'
      - BreakGlassUsageLog entry created with justification
      - Session linked to usage log via usage_log_id

  - name: test_break_glass_logout_triggers_rotation
    given:
      - Active break-glass session exists
    when:
      - POST /auth/logout/break-glass with session_id
    then:
      - Response rotation_triggered is true
      - BreakGlassUsageLog.logout_timestamp is set
      - BreakGlassUsageLog.post_usage_rotation_status is 'pending'
      - New credentials generated and exported

  - name: test_break_glass_actions_tracked
    given:
      - Active break-glass session exists
    when:
      - Perform unblock_user action via break-glass session
    then:
      - BreakGlassUsageLog.actions_performed contains action entry
      - Action entry has action, target, timestamp

  - name: test_normal_account_cannot_use_break_glass_endpoint
    given:
      - Break-glass access is enabled
      - Account 'alice' exists with is_break_glass=false
    when:
      - POST /auth/login/break-glass with alice's credentials
    then:
      - Response status is 403
      - Error message contains 'not a break-glass account'
