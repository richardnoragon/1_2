# Role Enforcement Contract

openapi: 3.0.3
info:
  title: Role Enforcement API
  version: 1.0.0
  description: |
    Contracts for four-tier role enforcement: dev > admin > user > readonly.
    Defines permission matrix and role escalation rules.

paths:
  /internal/roles/check:
    post:
      operationId: checkRolePermission
      summary: Check if role has permission for action
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - action
              properties:
                role:
                  type: string
                  enum: [dev, admin, user, readonly]
                action:
                  type: string
                resource:
                  type: string
      responses:
        "200":
          description: Permission check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionResult"

  /internal/accounts/{username}/role:
    patch:
      operationId: updateUserRole
      summary: Change user role (requires admin/dev)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - new_role
              properties:
                new_role:
                  type: string
                  enum: [dev, admin, user, readonly]
                justification:
                  type: string
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleChangeResult"
        "403":
          description: Insufficient privileges for role change
        "404":
          description: Account not found

components:
  schemas:
    PermissionResult:
      type: object
      required:
        - allowed
        - role
        - action
      properties:
        allowed:
          type: boolean
        role:
          type: string
        action:
          type: string
        reason:
          type: string
          description: Why permission was granted/denied

    RoleChangeResult:
      type: object
      required:
        - username
        - old_role
        - new_role
        - changed_by
      properties:
        username:
          type: string
        old_role:
          type: string
        new_role:
          type: string
        changed_by:
          type: string
        audit_id:
          type: integer

    RoleCapabilities:
      type: object
      properties:
        view_data:
          type: boolean
        modify_data:
          type: boolean
        manage_users:
          type: boolean
        manage_config:
          type: boolean
        access_debugging:
          type: boolean
        access_logs:
          type: boolean
        manage_break_glass:
          type: boolean
        manage_always_available:
          type: boolean

# Permission Matrix
x-role-matrix:
  dev:
    view_data: true
    modify_data: true
    manage_users: true
    manage_config: true
    access_debugging: true
    access_logs: true
    manage_break_glass: true
    manage_always_available: true

  admin:
    view_data: true
    modify_data: true
    manage_users: true
    manage_config: true
    access_debugging: false
    access_logs: true
    manage_break_glass: false
    manage_always_available: false

  user:
    view_data: true
    modify_data: true
    manage_users: false
    manage_config: false
    access_debugging: false
    access_logs: false
    manage_break_glass: false
    manage_always_available: false

  readonly:
    view_data: true
    modify_data: false
    manage_users: false
    manage_config: false
    access_debugging: false
    access_logs: false
    manage_break_glass: false
    manage_always_available: false

# Role Escalation Rules
x-escalation-rules:
  - from: readonly
    to: user
    requires: admin_approval
  - from: user
    to: admin
    requires: admin_approval
  - from: admin
    to: dev
    requires: dev_approval
  - from: any
    to: readonly
    requires: none # Demotion always allowed

# Contract Tests (pytest assertions)
x-contract-tests:
  - name: test_dev_has_all_capabilities
    given:
      - User with role 'dev'
    when:
      - Check each capability in role matrix
    then:
      - All capabilities return allowed=true

  - name: test_admin_cannot_access_debugging
    given:
      - User with role 'admin'
    when:
      - POST /internal/roles/check with action='access_debugging'
    then:
      - Response allowed is false
      - Response reason contains 'dev role required'

  - name: test_user_cannot_manage_users
    given:
      - User with role 'user'
    when:
      - POST /internal/roles/check with action='manage_users'
    then:
      - Response allowed is false
      - Response reason contains 'admin role required'

  - name: test_readonly_cannot_modify_data
    given:
      - User with role 'readonly'
    when:
      - POST /internal/roles/check with action='modify_data'
    then:
      - Response allowed is false
      - Response reason contains 'write access denied'

  - name: test_role_escalation_requires_approval
    given:
      - User 'alice' with role 'user'
      - Acting user with role 'admin'
    when:
      - PATCH /internal/accounts/alice/role with new_role='admin'
    then:
      - Response status is 200
      - AdminActionAudit logged with action_type='role_change'
      - Audit contains old_role='user', new_role='admin'

  - name: test_role_escalation_to_dev_requires_dev
    given:
      - User 'bob' with role 'admin'
      - Acting user with role 'admin' (not dev)
    when:
      - PATCH /internal/accounts/bob/role with new_role='dev'
    then:
      - Response status is 403
      - Error message contains 'dev role required for escalation to dev'

  - name: test_role_demotion_always_allowed
    given:
      - User 'charlie' with role 'admin'
      - Acting user with role 'admin'
    when:
      - PATCH /internal/accounts/charlie/role with new_role='user'
    then:
      - Response status is 200
      - AdminActionAudit logged with action_type='role_change'

  - name: test_readonly_role_denies_file_operations
    given:
      - User with role 'readonly'
    when:
      - Attempt file delete operation
    then:
      - Operation denied with clear permission error
      - Attempted operation logged in AdminActionAudit

  - name: test_standard_role_migrated_to_user
    given:
      - Legacy account with role 'standard'
    when:
      - Migration script runs
    then:
      - Account role is now 'user'
      - All previous permissions preserved
