name: Cross-Platform Network Tools CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'unit'
          - 'integration'
          - 'performance'
          - 'security'
      platforms:
        description: 'Platforms to test (comma-separated)'
        required: false
        default: 'ubuntu-latest,windows-latest,macos-latest'
        type: string

env:
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
  PIP_NO_CACHE_DIR: false
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  # Pre-flight checks
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.setup.outputs.python-versions }}
      test-matrix: ${{ steps.setup.outputs.test-matrix }}
      should-deploy: ${{ steps.setup.outputs.should-deploy }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper versioning
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install pre-flight dependencies
        run: |
          pip install --upgrade pip
          pip install gitpython packaging semver
      
      - name: Setup test matrix
        id: setup
        run: |
          python -c "
          import json
          import os
          
          # Python versions to test
          python_versions = ['3.8', '3.9', '3.10', '3.11', '3.12']
          
          # Platform matrix
          platforms = '${{ github.event.inputs.platforms || 'ubuntu-latest,windows-latest,macos-latest' }}'.split(',')
          
          # Test types
          test_type = '${{ github.event.inputs.test_type || 'all' }}'
          
          test_matrix = []
          for platform in platforms:
              for py_version in python_versions:
                  # Skip older Python versions on newer platforms
                  if platform == 'macos-latest' and py_version in ['3.8']:
                      continue
                  
                  test_matrix.append({
                      'os': platform.strip(),
                      'python-version': py_version,
                      'test-type': test_type
                  })
          
          # Deployment conditions
          should_deploy = (
              '${{ github.ref }}' == 'refs/heads/main' and
              '${{ github.event_name }}' == 'push'
          )
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'python-versions={json.dumps(python_versions)}\\n')
              f.write(f'test-matrix={json.dumps(test_matrix)}\\n')
              f.write(f'should-deploy={str(should_deploy).lower()}\\n')
          "
      
      - name: Validate project structure
        run: |
          python -c "
          import os
          import sys
          
          required_files = [
              'src/tools/network/network_connectivity_complex/deployment/install.py',
              'src/tools/privacy/privacy_tools/core/browser_detector.py',
              'src/tools/network/network_connectivity_complex/config/config_validator.py',
              'src/config_manager.py'
          ]
          
          missing_files = []
          for file_path in required_files:
              if not os.path.exists(file_path):
                  missing_files.append(file_path)
          
          if missing_files:
              print(f'Missing required files: {missing_files}')
              sys.exit(1)
          
          print('Project structure validation passed')
          "

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: preflight
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-quality-
            ${{ runner.os }}-pip-
      
      - name: Install quality tools
        run: |
          pip install --upgrade pip
          pip install flake8 pylint black isort mypy bandit safety
          pip install -r requirements.txt || echo "No requirements.txt found"
      
      - name: Run Black (code formatting)
        run: |
          black --check --diff src/ tests/ || true
      
      - name: Run isort (import sorting)
        run: |
          isort --check-only --diff src/ tests/ || true
      
      - name: Run Flake8 (linting)
        run: |
          flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503 || true
      
      - name: Run Pylint (advanced linting)
        run: |
          pylint src/ --disable=C0114,C0115,C0116,R0903,R0913 --max-line-length=88 || true
      
      - name: Run MyPy (type checking)
        run: |
          mypy src/ --ignore-missing-imports --disallow-untyped-defs || true
      
      - name: Run Bandit (security)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          cat bandit-report.json || echo "No bandit report generated"
      
      - name: Run Safety (dependency security)
        run: |
          safety check --json --output safety-report.json || true
          cat safety-report.json || echo "No safety report generated"
      
      - name: Upload quality reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: quality-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 7

  # Multi-platform testing
  test:
    name: Test on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.test-matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/AppData/Local/pip/Cache
            ~/Library/Caches/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
            ${{ runner.os }}-pip-
      
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            net-tools \
            iputils-ping \
            traceroute \
            dnsutils \
            iptables \
            wireless-tools \
            tcpdump \
            nmap \
            netcat-openbsd
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nmap
      
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Windows comes with most network tools built-in
          choco install nmap -y
        shell: pwsh
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-mock pytest-timeout
          pip install psutil requests
          pip install -r requirements.txt || echo "No requirements.txt found"
      
      - name: Install project in development mode
        run: |
          pip install -e .
        continue-on-error: true
      
      - name: Create test configuration
        run: |
          python -c "
          import json
          import os
          
          config = {
              'test_mode': True,
              'platform': '${{ runner.os }}',
              'python_version': '${{ matrix.python-version }}',
              'ci_environment': True,
              'timeout_seconds': 300,
              'parallel_tests': True,
              'log_level': 'DEBUG'
          }
          
          os.makedirs('tests/config', exist_ok=True)
          with open('tests/config/ci_config.json', 'w') as f:
              json.dump(config, f, indent=2)
          "
      
      - name: Run unit tests
        if: matrix.test-type == 'all' || matrix.test-type == 'unit'
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --timeout=300 \
            -n auto \
            --tb=short
        continue-on-error: true
      
      - name: Run integration tests
        if: matrix.test-type == 'all' || matrix.test-type == 'integration'
        run: |
          pytest tests/integration/ -v \
            --timeout=600 \
            --tb=short
        continue-on-error: true
      
      - name: Run cross-platform validation
        if: matrix.test-type == 'all' || matrix.test-type == 'integration'
        run: |
          python src/cross_platform/network_validator.py --verbose --export json
          python src/cross_platform/package_installer.py --dry-run --verbose
          python src/cross_platform/browser_detector.py --verbose
        continue-on-error: true
      
      - name: Run performance tests
        if: matrix.test-type == 'all' || matrix.test-type == 'performance'
        run: |
          pytest tests/performance/ -v \
            --timeout=900 \
            --tb=short
        continue-on-error: true
      
      - name: Run security tests
        if: matrix.test-type == 'all' || matrix.test-type == 'security'
        run: |
          pytest tests/security/ -v \
            --timeout=600 \
            --tb=short
        continue-on-error: true
      
      - name: Generate test reports
        if: always()
        run: |
          python -c "
          import json
          import os
          import platform
          from datetime import datetime
          
          # Collect test results and system info
          test_report = {
              'timestamp': datetime.now().isoformat(),
              'platform': {
                  'os': '${{ runner.os }}',
                  'python_version': '${{ matrix.python-version }}',
                  'architecture': platform.machine(),
                  'system': platform.system(),
                  'release': platform.release()
              },
              'test_type': '${{ matrix.test-type }}',
              'github': {
                  'ref': '${{ github.ref }}',
                  'sha': '${{ github.sha }}',
                  'run_id': '${{ github.run_id }}',
                  'run_number': '${{ github.run_number }}'
              }
          }
          
          os.makedirs('test-reports', exist_ok=True)
          report_file = f'test-reports/test-report-{\"${{ runner.os }}\".lower()}-py${{ matrix.python-version }}.json'
          
          with open(report_file, 'w') as f:
              json.dump(test_report, f, indent=2)
          
          print(f'Test report saved to: {report_file}')
          "
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            test-reports/
            coverage.xml
            htmlcov/
            network_validation_*.json
            network_validation_report_*.txt
          retention-days: 30
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Comprehensive validation
  validate:
    name: Comprehensive Validation
    runs-on: ubuntu-latest
    needs: [preflight, quality, test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Download all test artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      - name: Install validation dependencies
        run: |
          pip install --upgrade pip
          pip install jinja2 matplotlib seaborn pandas
      
      - name: Generate comprehensive validation report
        run: |
          python -c "
          import json
          import os
          import glob
          from datetime import datetime
          
          # Collect all test reports
          test_reports = []
          for report_file in glob.glob('artifacts/*/test-reports/*.json'):
              try:
                  with open(report_file, 'r') as f:
                      report = json.load(f)
                  test_reports.append(report)
              except Exception as e:
                  print(f'Error reading {report_file}: {e}')
          
          # Generate validation summary
          validation_summary = {
              'validation_date': datetime.now().isoformat(),
              'total_platforms': len(set(r['platform']['os'] for r in test_reports)),
              'total_python_versions': len(set(r['platform']['python_version'] for r in test_reports)),
              'total_test_runs': len(test_reports),
              'github_ref': '${{ github.ref }}',
              'github_sha': '${{ github.sha }}',
              'test_reports': test_reports
          }
          
          # Save comprehensive report
          with open('comprehensive_validation_results.json', 'w') as f:
              json.dump(validation_summary, f, indent=2)
          
          print(f'Comprehensive validation completed')
          print(f'Total platforms tested: {validation_summary[\"total_platforms\"]}')
          print(f'Total Python versions tested: {validation_summary[\"total_python_versions\"]}')
          print(f'Total test runs: {validation_summary[\"total_test_runs\"]}')
          "
      
      - name: Upload comprehensive results
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-validation-results
          path: |
            comprehensive_validation_results.json
          retention-days: 90

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: preflight
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Documentation generation
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
          pip install -r requirements.txt || echo "No requirements.txt found"
      
      - name: Generate API documentation
        run: |
          mkdir -p docs/
          python -c "
          import os
          import importlib.util
          
          # Generate documentation for each module
          modules = [
              'src/cross_platform/package_installer.py',
              'src/cross_platform/browser_detector.py',
              'src/cross_platform/network_validator.py'
          ]
          
          for module_path in modules:
              if os.path.exists(module_path):
                  module_name = os.path.basename(module_path).replace('.py', '')
                  print(f'Documenting {module_name}...')
                  # In a real implementation, would generate proper Sphinx docs
          "
      
      - name: Deploy documentation
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Documentation deployment would happen here"

  # Deployment (only on main branch)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [preflight, quality, test, validate]
    if: needs.preflight.outputs.should-deploy == 'true' && success()
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install build twine
      
      - name: Build distribution packages
        run: |
          python -m build
      
      - name: Verify build
        run: |
          twine check dist/*
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  # Notification
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [preflight, quality, test, validate, security, docs, deploy]
    if: always()
    
    steps:
      - name: Determine overall status
        id: status
        run: |
          # Determine if the workflow was successful
          if [[ "${{ needs.quality.result }}" == "success" && 
                "${{ needs.test.result }}" == "success" && 
                "${{ needs.validate.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare notification message
        id: message
        run: |
          cat > notification.json << EOF
          {
            "text": "Cross-Platform Network Tools CI/CD Results",
            "attachments": [
              {
                "color": "${{ steps.status.outputs.color }}",
                "fields": [
                  {
                    "title": "Status",
                    "value": "${{ steps.status.outputs.status }}",
                    "short": true
                  },
                  {
                    "title": "Branch",
                    "value": "${{ github.ref }}",
                    "short": true
                  },
                  {
                    "title": "Commit",
                    "value": "${{ github.sha }}",
                    "short": true
                  },
                  {
                    "title": "Quality Check",
                    "value": "${{ needs.quality.result }}",
                    "short": true
                  },
                  {
                    "title": "Tests",
                    "value": "${{ needs.test.result }}",
                    "short": true
                  },
                  {
                    "title": "Validation",
                    "value": "${{ needs.validate.result }}",
                    "short": true
                  }
                ]
              }
            ]
          }
          EOF
          
          echo "notification-ready=true" >> $GITHUB_OUTPUT
      
      - name: Send notification
        if: steps.message.outputs.notification-ready == 'true'
        run: |
          echo "Notification would be sent here"
          # In a real environment, this would send to Slack, Teams, email, etc.