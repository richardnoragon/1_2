# GitHub Actions Workflow for RFU Integration Testing
# Phase 1: Foundation Setup - CI/CD Pipeline Configuration
name: RFU Integration Tests

on:
  push:
    branches: [ master, develop, 'feature/*' ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod-like
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
        - smoke
        - integration
        - performance
        - security
        - full

env:
  PYTHON_VERSION: '3.11'
  RFU_TEST_MODE: 'true'
  RFU_LOG_LEVEL: 'INFO'

jobs:
  # Environment Setup and Validation
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.determine-envs.outputs.environments }}
      test-suite: ${{ steps.determine-tests.outputs.test-suite }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Determine environments to test
      id: determine-envs
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "environments=[\"${{ github.event.inputs.environment }}\"]" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          echo "environments=[\"dev\", \"staging\", \"prod-like\"]" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "environments=[\"dev\", \"staging\"]" >> $GITHUB_OUTPUT
        else
          echo "environments=[\"dev\"]" >> $GITHUB_OUTPUT
        fi
    
    - name: Determine test suite
      id: determine-tests
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "test-suite=${{ github.event.inputs.test_suite }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          echo "test-suite=full" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "test-suite=integration" >> $GITHUB_OUTPUT
        else
          echo "test-suite=smoke" >> $GITHUB_OUTPUT
        fi

  # Smoke Tests (Fast feedback)
  smoke-tests:
    needs: setup-environment
    runs-on: ubuntu-latest
    if: contains(fromJson(needs.setup-environment.outputs.test-suite), 'smoke') || needs.setup-environment.outputs.test-suite == 'full'
    
    strategy:
      matrix:
        environment: ${{ fromJson(needs.setup-environment.outputs.environments) }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Set up test environment
      run: |
        cd tests/integration
        python scripts/environment_manager.py create --environment ${{ matrix.environment }} --force
    
    - name: Validate environment
      run: |
        cd tests/integration
        python scripts/environment_manager.py validate --environment ${{ matrix.environment }}
    
    - name: Run smoke tests
      run: |
        pytest tests/integration/ \
          -m "smoke" \
          --environment=${{ matrix.environment }} \
          --timeout=300 \
          --tb=short \
          -v
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: smoke-test-results-${{ matrix.environment }}
        path: |
          tests/integration/logs/
          tests/integration/artifacts/

  # Integration Tests (Comprehensive testing)
  integration-tests:
    needs: [setup-environment, smoke-tests]
    runs-on: ubuntu-latest
    if: contains(fromJson(needs.setup-environment.outputs.test-suite), 'integration') || needs.setup-environment.outputs.test-suite == 'full'
    
    strategy:
      matrix:
        environment: ${{ fromJson(needs.setup-environment.outputs.environments) }}
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-glx \
          libglib2.0-0 \
          libxrender1 \
          libxext6 \
          libxi6 \
          libxtst6 \
          libxrandr2 \
          libasound2 \
          libpangocairo-1.0-0 \
          libcairo-gobject2 \
          libgtk-3-0 \
          libgdk-pixbuf2.0-0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Set up test environment
      run: |
        cd tests/integration
        python scripts/environment_manager.py create --environment ${{ matrix.environment }} --force
    
    - name: Run integration tests
      env:
        DISPLAY: ':99'
      run: |
        # Start virtual display for GUI tests
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        sleep 3
        
        pytest tests/integration/ \
          -m "integration" \
          --environment=${{ matrix.environment }} \
          --cov=src/ \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=test-results-${{ matrix.environment }}-py${{ matrix.python-version }}.xml \
          --html=test-report-${{ matrix.environment }}-py${{ matrix.python-version }}.html \
          --timeout=600 \
          --tb=long \
          -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: coverage.xml
        flags: integration
        name: codecov-${{ matrix.environment }}-py${{ matrix.python-version }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results-${{ matrix.environment }}-py${{ matrix.python-version }}
        path: |
          test-results-*.xml
          test-report-*.html
          htmlcov/
          tests/integration/logs/
          tests/integration/artifacts/

  # Performance Tests
  performance-tests:
    needs: [setup-environment, integration-tests]
    runs-on: ubuntu-latest
    if: contains(fromJson(needs.setup-environment.outputs.test-suite), 'performance') || needs.setup-environment.outputs.test-suite == 'full'
    
    strategy:
      matrix:
        environment: ['staging', 'prod-like']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
        pip install memory-profiler pytest-benchmark
    
    - name: Set up test environment
      run: |
        cd tests/integration
        python scripts/environment_manager.py create --environment ${{ matrix.environment }} --force
    
    - name: Run performance tests
      run: |
        pytest tests/integration/ \
          -m "performance" \
          --environment=${{ matrix.environment }} \
          --benchmark-only \
          --benchmark-json=benchmark-${{ matrix.environment }}.json \
          --timeout=1200 \
          -v
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results-${{ matrix.environment }}
        path: |
          benchmark-*.json
          tests/integration/logs/
          tests/integration/artifacts/

  # Security Tests
  security-tests:
    needs: [setup-environment, integration-tests]
    runs-on: ubuntu-latest
    if: contains(fromJson(needs.setup-environment.outputs.test-suite), 'security') || needs.setup-environment.outputs.test-suite == 'full'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
        pip install bandit safety semgrep
    
    - name: Run security linting with bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
    
    - name: Run dependency vulnerability scan
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Run semantic security analysis
      run: |
        semgrep --config=auto src/ --json --output=semgrep-report.json || true
    
    - name: Set up test environment
      run: |
        cd tests/integration
        python scripts/environment_manager.py create --environment staging --force
    
    - name: Run security integration tests
      run: |
        pytest tests/integration/security/ \
          --environment=staging \
          --timeout=900 \
          -v
    
    - name: Upload security results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.json
          tests/integration/logs/
          tests/integration/artifacts/

  # Cross-platform Tests
  cross-platform-tests:
    needs: setup-environment
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'schedule' || needs.setup-environment.outputs.test-suite == 'full'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11']
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Set up test environment
      run: |
        cd tests/integration
        python scripts/environment_manager.py create --environment dev --force
    
    - name: Run cross-platform tests
      run: |
        pytest tests/integration/ \
          -m "cross_platform" \
          --environment=dev \
          --timeout=600 \
          -v
    
    - name: Upload cross-platform results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: cross-platform-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          tests/integration/logs/
          tests/integration/artifacts/

  # Test Result Analysis and Reporting
  analyze-results:
    needs: [smoke-tests, integration-tests, performance-tests, security-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts/
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install analysis dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jinja2 python-dateutil
    
    - name: Generate test report
      run: |
        python tests/integration/scripts/generate_test_report.py \
          --artifacts-dir test-artifacts/ \
          --output-dir test-reports/
    
    - name: Upload consolidated report
      uses: actions/upload-artifact@v3
      with:
        name: consolidated-test-report
        path: test-reports/
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            const reportPath = 'test-reports/summary.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              const comment = `
              ## 🧪 Integration Test Results
              
              **Overall Status**: ${report.overall_status === 'pass' ? '✅ PASS' : '❌ FAIL'}
              
              **Summary**:
              - Total Tests: ${report.total_tests}
              - Passed: ${report.passed_tests}
              - Failed: ${report.failed_tests}
              - Coverage: ${report.coverage_percentage}%
              
              **Environment Results**:
              ${report.environments.map(env => 
                `- ${env.name}: ${env.status === 'pass' ? '✅' : '❌'} (${env.test_count} tests)`
              ).join('\n')}
              
              [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not post test results comment:', error);
          }

  # Cleanup
  cleanup:
    needs: [analyze-results]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
    
    - name: Cleanup test environments
      run: |
        cd tests/integration
        for env in dev staging prod-like; do
          python scripts/environment_manager.py cleanup --environment $env --preserve-config
        done