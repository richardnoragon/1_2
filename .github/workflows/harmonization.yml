name: Harmonization contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    # Intel macOS matches the PyQt5 runtime used by the application.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyQt5 pytest PyMuPDF==1.25.4 psutil==7.0.0 requests==2.32.3 argon2-cffi==23.1.0 schedule==1.2.2 Pillow==11.1.0
      - name: Shared UI and operational contracts
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || runner.os == 'Windows' && 'windows' || 'cocoa' }}
          QT_MAC_WANTS_LAYER: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/harmonization tests/unit/core/test_tool_lifecycle.py -q --junitxml=harmonization-tests.xml
      - name: Reject static UI font, menu and translation-key violations
        run: python scripts/quality/check_harmonization.py --report harmonization-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmonization-${{ runner.os }}
          path: |
            harmonization-report.json
            harmonization-tests.xml
