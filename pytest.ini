[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    gui: GUI component tests
    integration: Integration tests
    slow: Tests that take longer to run
    unit: Unit tests
    functional: Functional tests
    error: Error handling tests
    performance: Performance tests
    stress: Stress tests
    edge_case: Edge case tests
    network: Network functionality tests
    mock: Tests that use mocking extensively

# Qt configuration
qt_api = pyqt5

# Test execution options
addopts =
    --verbose
    --tb=short
    -p no:warnings
    --color=yes
    --durations=10
    --html=tests/unit/result_enhanced_editor_2025-08-31.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_enhanced_editor_2025-08-31.json
    --cov=src.utilities.file_operations.enhanced_editor
    --cov-report=html:tests/unit/result_enhanced_editor_coverage_2025-08-31
    --cov-report=term-missing
    --cov-report=json:tests/unit/result_enhanced_editor_coverage_2025-08-31.json
    --cov-branch
    --cov-fail-under=80
    --maxfail=3

# Configure logging during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Maximum test duration before considering it slow
slow_test_threshold = 1.0

# Test file patterns
norecursedirs = .git .tox .eggs build dist __pycache__ *.egg-info

# Environment variables for tests
env =
    TEST_MODE=1
    PYTHONPATH=.