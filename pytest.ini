[pytest]
testpaths = tests src scripts
addopts =
    --strict-markers
    --strict-config
    -p no:pytest_lazyfixture
    --ignore=archive/
    --ignore=emergency-backup-*/
    --ignore=backups/
    --ignore=file_utilities_2/
    --ignore=src_backup/
    --ignore=RFU/
    --ignore=tests/test_file_explorer/
    --ignore=tests/phase3_enterprise_memory_management_test.py
    --ignore=tests/phase3_lightweight_memory_test.py
    --ignore=tests/phase5_comprehensive/
    --ignore=tests/ui/test_pane_creation.py
    --ignore=tests/ui/test_minimal_pane.py
    --ignore=tests/validation/cleanup_validation_test.py
    --ignore=tests/validation/comprehensive_checksum_validation.py
    --ignore=tests/validation/comprehensive_integration_test.py
    --ignore=tests/test_tag_viewer_editor.py
    # HP-04: Embedded tests in src/tools with import issues
    --ignore=src/tools/file_management/advanced_folders/engine/test_suite.py
    --ignore=src/tools/file_management/advanced_folders/gui/tests/
    --ignore=src/tools/network/network_connectivity_complex/tests/
    --ignore=src/tools/privacy/privacy_tools/tests/
    # HP-04: Development testing scripts with syntax errors
    --ignore=scripts/development/testing/

markers =
    unit: Unit tests
    integration: Integration tests
    identity: Identity workflow integration tests
    contract: Contract-level API compatibility tests
    performance: Performance envelope validation tests
    cli: CLI workflow coverage
    smoke: Smoke tests
    slow: Tests that take a long time to run
    gui: Tests that require GUI components
    pdf: Tests that work with PDF files
    edge_case: Edge case tests
    compatibility: Compatibility tests
    critical: Critical functionality tests
    validation: Validation tests
