[tool:pytest]
# Test discovery for extract_image_cli.py
testpaths = .
python_files = test_extract_image_cli_2025-08-24.py
python_classes = Test*
python_functions = test_*

# Command line options for extract_image_cli testing
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=long
    --cov=src.utilities.pdf_tools.pdf_content_extraction.extract_image_cli
    --cov-report=html:tests/unit/result_extract_image_cli_coverage_2025-08-24
    --cov-report=json:tests/unit/result_extract_image_cli_coverage_2025-08-24.json
    --cov-report=term-missing
    --html=tests/unit/result_extract_image_cli_test_report_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_extract_image_cli_test_results_2025-08-24.json
    --durations=10
    --capture=no
    --maxfail=5
    --showlocals

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test markers specific to extract_image_cli.py
markers =
    unit: Unit tests for extract_image_cli functions
    gui: Tests that require PyQt5 GUI components
    pdf: Tests that work with PDF files and image extraction
    integration: Integration tests with file system operations
    slow: Tests that take a long time to run
    mock: Tests using mock objects and fixtures

# Coverage settings
[coverage:run]
source = src.utilities.pdf_tools.pdf_content_extraction.extract_image_cli
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = tests/unit/result_extract_image_cli_coverage_2025-08-24

# Timeout settings
timeout = 300