# System Cleanup Test Configuration
# pytest configuration specifically for system_cleanup.py testing
# Created: 2025-08-28
# Target: system_cleanup.py

[tool:pytest]
# Test discovery for system cleanup
testpaths = .
python_files = test_system_cleanup_*.py
python_classes = Test*
python_functions = test_*

# Enhanced reporting for system cleanup tests
addopts = 
    --verbose
    --tb=long
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --html=result_system_cleanup_report_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_system_cleanup_json_2025-08-28.json
    --cov=../../src/utilities/system/system_cleanup
    --cov-report=html:result_system_cleanup_coverage_2025-08-28
    --cov-report=json:result_system_cleanup_coverage_2025-08-28.json
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=80

# System cleanup specific markers
markers =
    unit: Unit tests for system cleanup components
    integration: Integration tests for cleanup workflow
    gui: GUI component tests
    cleanup: Core cleanup functionality tests
    safety: Safety and security feature tests
    temp_files: Temporary file cleanup tests
    error_handling: Error handling and edge case tests
    mock: Tests using mocks and stubs
    slow: Slow running comprehensive tests

# Minimum version and timeouts
minversion = 6.0
timeout = 600

# Enhanced logging for debugging
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings specific to system cleanup testing
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:PyQt5.*
    ignore::ImportWarning
    ignore::RuntimeWarning:.*cleanup.*