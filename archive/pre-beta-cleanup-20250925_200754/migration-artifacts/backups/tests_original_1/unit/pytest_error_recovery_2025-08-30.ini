[tool:pytest]
# Pytest configuration for error_recovery comprehensive testing
# Generated: 2025-08-30

testpaths = .
python_files = test_error_recovery_2025-08-30.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=result_error_recovery_2025-08-30_report.html
    --self-contained-html
    --json-report
    --json-report-file=result_error_recovery_2025-08-30_results.json
    --cov=src.utilities.privacy.error_recovery
    --cov-report=html:result_error_recovery_2025-08-30_coverage
    --cov-report=json:result_error_recovery_2025-08-30_coverage.json
    --cov-report=term-missing
    --cov-fail-under=85
    --junit-xml=result_error_recovery_2025-08-30_junit.xml

# Markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for combined functionality
    edge_case: Edge case and boundary condition tests
    mock: Tests using mocked dependencies
    slow: Tests that take longer to run

# Test discovery
collect_ignore = []
norecursedirs = __pycache__ .git .pytest_cache

# Coverage settings
coverage_exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S