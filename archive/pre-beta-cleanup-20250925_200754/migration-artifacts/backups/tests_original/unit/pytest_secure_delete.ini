[tool:pytest]
# Pytest configuration for secure_delete.py unit tests
# Generated: 2025-08-28

minversion = 6.0
addopts = 
    -ra 
    -q 
    --strict-markers 
    --strict-config 
    --cov=src.utilities.security.secure_delete 
    --cov-report=html:tests/unit/result_secure_delete_coverage_2025-08-28
    --cov-report=json:tests/unit/result_secure_delete_coverage_2025-08-28.json
    --cov-report=term-missing
    --html=tests/unit/result_secure_delete_report_2025-08-28.html
    --self-contained-html
    --junitxml=tests/unit/result_secure_delete_junit_2025-08-28.xml
    --tb=short
    -v

testpaths = 
    tests/unit

python_files = test_secure_delete_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

[coverage:run]
source = src/utilities/security
branch = true
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = tests/unit/result_secure_delete_coverage_2025-08-28
title = Secure Delete Unit Test Coverage Report - Generated 2025-08-28