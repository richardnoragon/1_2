[tool:pytest]
# Pytest configuration for convert_to_docx.py comprehensive testing
# Generated on: 2025-08-24

# Test discovery
testpaths = .
python_files = test_convert_to_docx_2025-08-24.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --html=result_convert_to_docx_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_convert_to_docx_2025-08-24.json
    --cov=convert_to_docx
    --cov-report=html:result_convert_to_docx_coverage_2025-08-24
    --cov-report=json:result_convert_to_docx_coverage_2025-08-24.json
    --cov-report=term-missing
    --junitxml=result_convert_to_docx_2025-08-24_junit.xml
    --capture=no
    --durations=10

# Coverage settings
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Test timeouts
timeout = 300

# Minimum Python version
minversion = 6.0

# Additional markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interaction
    gui: Tests requiring GUI components
    slow: Tests that take a long time to run