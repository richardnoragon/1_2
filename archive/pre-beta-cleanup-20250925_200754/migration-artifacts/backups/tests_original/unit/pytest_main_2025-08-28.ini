[tool:pytest]
# Pytest configuration for main.py unit tests - 2025-08-28
# Comprehensive testing configuration for Richard's File Utilities main module

# Test discovery
testpaths = .
python_files = test_main_2025-08-28.py
python_classes = Test*
python_functions = test_*

# Core options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --disable-warnings
    --durations=10
    --maxfail=10

# Output and reporting
addopts = 
    --html=result_main_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_main_2025-08-28.json
    --junitxml=result_main_2025-08-28.xml

# Coverage configuration
addopts = 
    --cov=main
    --cov-config=.coveragerc
    --cov-report=html:result_main_2025-08-28_coverage
    --cov-report=xml:result_main_2025-08-28_coverage.xml
    --cov-report=term-missing
    --cov-report=annotate:result_main_2025-08-28_annotate
    --cov-fail-under=70
    --cov-branch

# Performance and timeout
timeout = 300
timeout_method = thread

# Parallel execution (if needed)
# addopts = -n auto

# Test markers
markers =
    unit: Unit tests for individual functions and methods
    integration: Integration tests for component interaction
    gui: Tests for GUI components and user interface
    database: Tests requiring database functionality
    security: Security-related functionality tests
    performance: Performance and load testing
    slow: Tests that take longer than 5 seconds
    network: Tests requiring network connectivity
    file_ops: Tests involving file operations
    error_handling: Tests for error scenarios and edge cases

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s.%(funcName)s:%(lineno)d: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = result_main_2025-08-28_pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s.%(funcName)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Minimum version requirements
minversion = 7.0

# Required plugins
required_plugins = 
    pytest-html>=3.1.0
    pytest-json-report>=1.5.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    pytest-timeout>=2.1.0

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning
    # Ignore PyQt5 specific warnings during testing
    ignore:.*PySide2.*:UserWarning
    ignore:.*PyQt5.*:UserWarning
    # Ignore specific library warnings
    ignore:.*pkg_resources.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning

# Environment variables for testing
env = 
    PYTEST_RUNNING=1
    QT_QPA_PLATFORM=offscreen
    PYTHONPATH=../..
    TESTING_MODE=1
    LOG_LEVEL=DEBUG

# Test collection configuration
collect_ignore = [
    "setup.py",
    "conftest.py.backup",
    "test_data/",
    "__pycache__/",
    ".pytest_cache/",
    "coverage*/",
    "result_*/",
    "logs/"
]

# Console output options
console_output_style = progress
junit_family = xunit2

# Cache configuration
cache_dir = .pytest_cache