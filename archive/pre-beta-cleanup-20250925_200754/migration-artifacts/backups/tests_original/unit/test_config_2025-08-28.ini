# Pytest configuration for config_manager tests
# File: test_config_2025-08-28.ini
# Date: 2025-08-28

[tool:pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --durations=10
    --html=result_config_manager_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_config_manager_2025-08-28.json
    --cov=../../config_manager.py
    --cov-report=html:result_config_manager_coverage_2025-08-28
    --cov-report=json:result_config_manager_coverage_2025-08-28.json
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=85

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

minversion = 6.0
timeout = 300