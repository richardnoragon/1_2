# Pytest Configuration for Network Scanner Tests
# Generated on 2025-08-24

[tool:pytest]
# Test discovery
testpaths = tests/unit
python_files = test_network_scanner_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --html=tests/unit/result_network_scanner_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_network_scanner_2025-08-24.json
    --cov=src.utilities.network.network_scanner
    --cov-report=html:tests/unit/result_network_scanner_coverage_2025-08-24
    --cov-report=term-missing
    --cov-report=json:tests/unit/result_network_scanner_coverage_2025-08-24.json
    --cov-fail-under=80
    --durations=10

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests as GUI tests
    network: marks tests requiring network connectivity
    performance: marks tests as performance tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning

# Test timeout
timeout = 300

# Coverage configuration
[coverage:run]
source = src/utilities/network/network_scanner
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2
skip_covered = False

[coverage:html]
directory = tests/unit/result_network_scanner_coverage_2025-08-24
title = Network Scanner Test Coverage Report