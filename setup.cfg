[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    archive,
    emergency-backup-*,
    backups
extend-ignore = E203, W503
per-file-ignores =
    __init__.py:F401,F403
    */models/__init__.py:F822
    */services/__init__.py:F822
    */features/__init__.py:F822
    src/tabbed_hub.py:E501,F401,F821,F811,C901

[mypy]
python_version = 3.12
mypy_path = src
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = normal
ignore_missing_imports = True
plugins =
    numpy.typing.mypy_plugin

[mypy-src.core.auth.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-src.core.preferences.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.file_explorer.models.*]
disallow_untyped_defs = True

[mypy-src.file_explorer.services.*]
disallow_untyped_defs = True

[mypy-src.file_explorer.features.*]
disallow_untyped_defs = True

[mypy-tests.*]
disallow_untyped_defs = False

[tool:pytest]
addopts =
    --strict-markers
    --strict-config
    --randomly-seed=auto
    --timeout=45
    --maxfail=1
    --durations=10
    --color=yes
    --showlocals
    --ignore=archive/legacy_code
    --ignore=file_utilities_2
    --ignore=scripts/development/testing
required_plugins =
    pytest-cov
    pytest-timeout
    pytest-randomly
    pytest-order
    pytest-dependency
norecursedirs =
    archive
    legacy_code
    emergency-backup-*
    file_utilities_2
    scripts/development/testing
    venv
    .venv
testpaths =
    tests/contracts
    tests/integration
    tests/performance
    tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Module-level unit tests
    integration: End-to-end integration tests mapped from quickstart.md
    contract: Identity contract tests derived from authentication.yaml
    gui: UI/Qt driven flows
    cli: CLI/admin workflow coverage
    performance: Performance envelope validation
    identity: Identity-specific scenarios (lockout, reset, approvals)
    slow: Explicitly long-running tests
    smoke: Lightweight health checks
