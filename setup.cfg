[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    archive,
    emergency-backup-*,
    backups
extend-ignore = E203, W503
per-file-ignores =
    __init__.py:F401,F403
    */models/__init__.py:F822
    */services/__init__.py:F822
    */features/__init__.py:F822

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = normal
ignore_missing_imports = True

[mypy-src.file_explorer.models.*]
disallow_untyped_defs = True

[mypy-src.file_explorer.services.*]
disallow_untyped_defs = True

[mypy-src.file_explorer.features.*]
disallow_untyped_defs = True

[mypy-tests.*]
disallow_untyped_defs = False
