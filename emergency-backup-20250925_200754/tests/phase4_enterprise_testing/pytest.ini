# pytest configuration for Advanced Folders Enterprise Testing
# Phase 4: Testing & QA (Week 10) - Enterprise-Grade Test Configuration

[tool:pytest]
# Test discovery
testpaths = tests/phase4_enterprise_testing
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 6.0

# Default options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    --capture=no
    --durations=10
    --cov=src
    --cov-report=term-missing
    --cov-report=html:test_reports/coverage_html
    --cov-report=xml:test_reports/coverage.xml
    --cov-fail-under=90
    --html=test_reports/pytest_report.html
    --self-contained-html
    --junitxml=test_reports/junit.xml

# Test markers
markers =
    unit: Unit tests with >90% coverage requirement
    integration: Integration tests validating cross-component functionality
    performance: Performance tests with quantitative benchmarks
    security: Security tests with zero-tolerance policy
    stress: Stress testing for system limits
    critical: Critical tests that must pass for deployment
    slow: Tests that run longer than 30 seconds
    network: Tests requiring network connectivity
    database: Tests requiring database connections
    gui: Tests requiring GUI components
    concurrent: Tests validating concurrent operations
    memory: Tests validating memory usage and limits
    regression: Regression tests for known issues

# Test discovery patterns
# Exclude patterns
norecursedirs = 
    .git
    .pytest_cache
    *.egg-info
    dist
    build
    __pycache__
    .venv
    venv
    env
    archive
    backups
    legacy_code

# Timeout configuration
timeout = 300
timeout_method = thread

# Warnings configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::FutureWarning

# Console output
console_output_style = progress

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = test_reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */conftest.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */.pytest_cache/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = true
skip_covered = false
precision = 2

[coverage:html]
directory = test_reports/coverage_html
title = Advanced Folders System Coverage Report

[coverage:xml]
output = test_reports/coverage.xml