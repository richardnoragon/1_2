[tool:pytest]
# Pytest configuration for bookmark_manager.py unit tests
# Generated on 2025-08-24

minversion = 6.0
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=src.utilities.network.bookmark_manager
    --cov-report=term-missing
    --cov-report=html:tests/unit/result_bookmark_manager_coverage_2025-08-24
    --cov-report=json:tests/unit/result_bookmark_manager_coverage_2025-08-24.json
    --html=tests/unit/result_bookmark_manager_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_bookmark_manager_2025-08-24.json

testpaths = tests/unit
python_files = test_bookmark_manager_2025-08-24.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests that require GUI components
    database: marks tests that use database operations
    network: marks tests that require network access

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:PyQt5.*

# Coverage configuration
[coverage:run]
source = src/utilities/network/bookmark_manager
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = tests/unit/result_bookmark_manager_coverage_2025-08-24
title = Bookmark Manager Test Coverage Report
show_contexts = true

[coverage:json]
output = tests/unit/result_bookmark_manager_coverage_2025-08-24.json
pretty_print = true
show_contexts = true