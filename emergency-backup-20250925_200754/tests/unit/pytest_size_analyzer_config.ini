[tool:pytest]
# Pytest configuration for size_analyzer_config.py testing
# Created on August 29, 2025

# Test discovery
testpaths = .
python_files = test_size_analyzer_config_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --html=result_size_analyzer_config_2025-08-29.html
    --self-contained-html
    --json-report
    --json-report-file=result_size_analyzer_config_2025-08-29.json
    --cov=src.utilities.analysis.config.size_analyzer_config
    --cov-report=html:result_size_analyzer_config_coverage_2025-08-29
    --cov-report=json:result_size_analyzer_config_coverage_2025-08-29.json
    --cov-report=term-missing
    --cov-branch

# Markers
markers =
    unit: Unit tests for size_analyzer_config
    integration: Integration tests
    slow: Slow running tests
    edge_cases: Edge case tests

# Minimum Python version
minversion = 6.0

# Test timeouts
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::ImportWarning