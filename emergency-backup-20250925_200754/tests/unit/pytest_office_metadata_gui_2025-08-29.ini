[tool:pytest]
# Pytest configuration for office_metadata_gui tests
# Generated: 2025-08-29

testpaths = .
python_files = test_office_metadata_gui_*.py
python_classes = Test*
python_functions = test_*

# Output configurations
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --html=result_office_metadata_gui_2025-08-29.html
    --self-contained-html
    --json-report
    --json-report-file=result_office_metadata_gui_2025-08-29.json
    --cov=src.tools.metadata.office_metadata.office_metadata_gui
    --cov-report=html:result_office_metadata_gui_coverage_2025-08-29
    --cov-report=json:result_office_metadata_gui_coverage_2025-08-29.json
    --cov-report=xml:result_office_metadata_gui_coverage_2025-08-29.xml
    --cov-report=term-missing
    --cov-fail-under=80
    --maxfail=5
    --durations=10

# Test markers
markers =
    gui: GUI-related tests requiring PyQt5
    integration: Integration tests
    unit: Unit tests
    edge_case: Edge case and error condition tests
    slow: Slow running tests

# Minimum version requirements
minversion = 6.0

# Test discovery patterns
collect_ignore = [
    "setup.py",
    "conftest.py",
    "__pycache__"
]

# Filtering options
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*PyQt5.*:UserWarning

# Timeout settings (in seconds)
timeout = 300
timeout_method = thread

# Parallel execution (if pytest-xdist is available)
# -n auto

# Coverage settings
[coverage:run]
source = src/tools/metadata/office_metadata/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */conftest.py
branch = true
parallel = true

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
    
precision = 2
show_missing = true
sort = Cover

[coverage:html]
directory = result_office_metadata_gui_coverage_2025-08-29
title = Office Metadata GUI Test Coverage Report

[coverage:xml]
output = result_office_metadata_gui_coverage_2025-08-29.xml

[coverage:json]
output = result_office_metadata_gui_coverage_2025-08-29.json
pretty_print = true