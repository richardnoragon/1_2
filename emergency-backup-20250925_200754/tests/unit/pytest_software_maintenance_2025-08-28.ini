[tool:pytest]
# Pytest configuration for Software Maintenance testing
# Generated on 2025-08-28

# Test discovery
testpaths = .
python_files = test_software_maintenance_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --html=result_software_maintenance_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_software_maintenance_2025-08-28.json
    --cov=src.utilities.system.software_maintenance
    --cov-report=html:result_software_maintenance_coverage_2025-08-28
    --cov-report=json:result_software_maintenance_coverage_2025-08-28.json
    --cov-report=xml:result_software_maintenance_coverage_2025-08-28.xml
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=80
    --durations=10
    --maxfail=10

# Markers
markers =
    unit: Unit tests for software maintenance components
    integration: Integration tests for software maintenance workflow
    gui: GUI related tests requiring PyQt5
    performance: Performance and stress tests
    slow: Slow running tests (timeout > 30s)
    network: Tests requiring network connectivity
    windows: Windows-specific tests

# Minimum Python version
minversion = 6.0

# Test timeouts
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log file output
log_file = logs/software_maintenance_test_2025-08-28.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
    ignore::ImportWarning

# Test collection
collect_ignore = [
    "setup.py",
    "conftest.py",
    "test_data/"
]

# Pytest plugins
addopts = --strict-config
required_plugins = 
    pytest-html>=3.1.0
    pytest-json-report>=1.5.0
    pytest-cov>=4.0.0
    pytest-timeout>=2.1.0

# Coverage configuration
[coverage:run]
source = src/utilities/system/software_maintenance
branch = true
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = result_software_maintenance_coverage_2025-08-28
title = Software Maintenance Test Coverage Report
show_contexts = true

[coverage:xml]
output = result_software_maintenance_coverage_2025-08-28.xml