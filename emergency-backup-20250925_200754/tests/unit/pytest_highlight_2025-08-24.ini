[tool:pytest]
# Pytest configuration for comprehensive testing of highlight.py
# Generated on August 24, 2025
# Test discovery and execution settings for PDF highlighting tool

# Test discovery
testpaths = .
python_files = test_highlight_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting configuration
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --html=result_highlight_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_highlight_2025-08-24.json
    --cov=highlight
    --cov-report=html:result_highlight_coverage_2025-08-24
    --cov-report=json:result_highlight_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=80
    --junit-xml=result_highlight_2025-08-24_junit.xml

# Test markers for categorization
markers =
    unit: Unit tests for individual functions and methods
    integration: Integration tests for complete workflows
    pdf_tools: PDF processing related tests
    gui: GUI component tests
    slow: Tests that take longer to execute
    mock: Tests using extensive mocking
    edge_case: Edge case and boundary condition tests
    error_handling: Exception and error handling tests
    performance: Performance and load tests

# Minimum Python version requirement
minversion = 6.0

# Test execution timeouts
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log file configuration
log_file = logs/highlight_test_2025-08-24.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
    ignore::ImportWarning

# Test collection and execution
collect_ignore = ["setup.py"]
norecursedirs = .git .tox dist build *.egg

# Coverage configuration
[coverage:run]
source = highlight
omit = 
    */tests/*
    */test_*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = result_highlight_coverage_2025-08-24