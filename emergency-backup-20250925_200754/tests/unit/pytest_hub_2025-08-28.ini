[tool:pytest]
# Pytest configuration for hub.py unit tests
# Created: 2025-08-28
# Target: hub.py comprehensive testing

# Test discovery
testpaths = .
python_files = test_hub_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --html=result_hub_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_hub_2025-08-28.json
    --cov=src.rfu.hub
    --cov-report=html:htmlcov_hub_2025-08-28
    --cov-report=json:coverage_hub_2025-08-28.json
    --cov-report=term-missing
    --cov-branch
    --durations=10
    --junit-xml=result_hub_2025-08-28.xml

# Markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interaction
    gui: Tests requiring GUI components
    mock: Tests using mock objects
    edge_case: Edge case and error condition tests
    performance: Performance-related tests

# Minimum version requirements
minversion = 6.0

# Test session configuration
console_output_style = progress
junit_family = xunit2

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

[coverage:run]
source = src/rfu
branch = True
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    except ImportError:
    pass

[coverage:html]
directory = htmlcov_hub_2025-08-28

[coverage:json]
output = coverage_hub_2025-08-28.json