[tool:pytest]
# Test discovery
testpaths = tests/unit
python_files = test_watermark_2025-08-24.py
python_classes = Test*
python_functions = test_*

# Reporting options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=src.utilities.pdf_tools.pdf_enhancements.watermark
    --cov-report=html:tests/unit/result_watermark_coverage_2025-08-24/
    --cov-report=json:tests/unit/result_watermark_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-fail-under=90
    --html=tests/unit/result_watermark_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_watermark_2025-08-24.json
    --junit-xml=tests/unit/result_watermark_2025-08-24_junit.xml

# Coverage settings
[coverage:run]
source = src/utilities/pdf_tools/pdf_enhancements/
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = tests/unit/result_watermark_coverage_2025-08-24/

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    gui: GUI tests
    slow: Slow tests
    pdf: PDF related tests
    watermark: Watermark specific tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum version
minversion = 6.0

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning