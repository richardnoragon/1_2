[tool:pytest]
minversion = 6.0
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings
    --html=results/result_privacy_base_2025-08-30.html
    --self-contained-html
    --json-report
    --json-report-file=results/result_privacy_base_2025-08-30.json
    --junit-xml=results/result_privacy_base_2025-08-30_junit.xml
    --cov=src.utilities.privacy.privacy_tools.core.privacy_base
    --cov-report=html:results/result_privacy_base_2025-08-30_coverage
    --cov-report=json:results/result_privacy_base_2025-08-30_coverage.json
    --cov-report=term-missing
    --cov-fail-under=80

testpaths = tests/unit
python_files = test_privacy_base_2025-08-30.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that use database operations
    filesystem: marks tests that use filesystem operations
    
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings
timeout = 300
timeout_method = thread

# Coverage settings
[coverage:run]
source = src/utilities/privacy/privacy_tools/core/privacy_base
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod