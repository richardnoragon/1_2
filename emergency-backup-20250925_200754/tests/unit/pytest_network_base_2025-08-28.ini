[tool:pytest]
testpaths = .
python_files = test_network_base_2025-08-28.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --html=result_network_base_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_network_base_2025-08-28.json
    --cov=utilities.network.network_connectivity_complex.core.network_base
    --cov-report=html:coverage_network_base_2025-08-28
    --cov-report=json:result_network_base_coverage_2025-08-28.json
    --cov-report=term-missing
    --cov-config=.coveragerc_network_base_2025-08-28
    --durations=10
    --capture=no

markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    performance: Performance and load tests
    threading: Multi-threading safety tests
    edge_case: Edge case and boundary condition tests
    mock: Tests using extensive mocking
    slow: Tests that take longer to execute
    signal: Tests for PyQt signal functionality

minversion = 6.0
required_plugins = 
    pytest-html>=3.0.0
    pytest-json-report>=1.5.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest_network_base_2025-08-28.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s (%(filename)s:%(lineno)d): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:PyQt5.*

timeout = 300
timeout_method = thread

junit_suite_name = network_base_tests
junit_logging = all
junit_log_passing_tests = false
junit_family = xunit2