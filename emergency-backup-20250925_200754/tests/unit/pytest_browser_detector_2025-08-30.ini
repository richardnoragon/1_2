[tool:pytest]
testpaths = tests/unit
python_files = test_browser_detector_2025-08-30.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=src.utilities.privacy.privacy_tools.core.browser_detector
    --cov-report=html:tests/unit/results/coverage_browser_detector_2025-08-30
    --cov-report=json:tests/unit/results/result_browser_detector_2025-08-30_coverage.json
    --cov-report=term-missing
    --html=tests/unit/results/result_browser_detector_2025-08-30_report.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/results/result_browser_detector_2025-08-30_results.json
    --junit-xml=tests/unit/results/result_browser_detector_2025-08-30_junit.xml
    --timeout=60
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    parametrize: marks parametrized tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning