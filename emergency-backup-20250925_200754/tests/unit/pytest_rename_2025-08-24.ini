[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --tb=short
    --cov=src.utilities.file_management.rename
    --cov-report=html:C:/Users/HP1/1_2/1_2/tests/unit/htmlcov_rename_2025-08-24
    --cov-report=json:C:/Users/HP1/1_2/1_2/tests/unit/coverage_rename_2025-08-24.json
    --cov-report=term-missing
    --junitxml=C:/Users/HP1/1_2/1_2/tests/unit/junit_rename_2025-08-24.xml
testpaths = 
    tests/unit
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
python_functions = 
    test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning