[tool:pytest]
# Pytest configuration for Enhanced Editor testing

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add current directory to Python path
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --durations=10
    --cov=src.utilities.file_operations.enhanced_editor.enhanced_editor
    --cov-report=html:c:\Users\richardi\1_2\tests\unit\result_enhanced_editor_coverage_2025-08-29
    --cov-report=json:c:\Users\richardi\1_2\tests\unit\result_enhanced_editor_coverage_2025-08-29.json
    --cov-report=term-missing
    --html=c:\Users\richardi\1_2\tests\unit\result_enhanced_editor_report_2025-08-29.html
    --self-contained-html
    --json-report
    --json-report-file=c:\Users\richardi\1_2\tests\unit\result_enhanced_editor_results_2025-08-29.json

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests that require GUI components
    performance: marks tests that test performance

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Test paths
testpaths = 
    tests/unit

# Coverage settings
[coverage:run]
source = src/utilities/file_operations/enhanced_editor
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod