[tool:pytest]
# Pytest configuration for launch_main.py unit tests
# Created: 2025-08-28

# Test discovery
testpaths = .
python_files = test_launch_main_2025-08-28.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --html=result_launch_main_2025-08-28.html
    --self-contained-html
    --json-report=result_launch_main_2025-08-28.json
    --json-report-file=result_launch_main_2025-08-28.json
    --cov=launch_main
    --cov-report=html:coverage_launch_main_2025-08-28
    --cov-report=json:coverage_launch_main_2025-08-28.json
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=85

# Test markers
markers =
    unit: Unit tests for individual functions and methods
    integration: Integration tests with real file system
    edge_case: Edge cases and boundary condition tests
    performance: Performance and resource usage tests
    slow: Tests that take longer to execute
    
# Coverage settings
[coverage:run]
source = .
branch = True
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */build/*
    */dist/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = coverage_launch_main_2025-08-28
title = Launch Main Coverage Report 2025-08-28

[coverage:json]
output = coverage_launch_main_2025-08-28.json