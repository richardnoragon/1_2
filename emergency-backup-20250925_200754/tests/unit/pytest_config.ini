[tool:pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --html=tests/unit/result_diagnostics_monitoring_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_diagnostics_monitoring_2025-08-28.json
    --cov=src/utilities/system/diagnostics_monitoring
    --cov-report=html:tests/unit/result_diagnostics_monitoring_coverage_2025-08-28
    --cov-report=term-missing
    --cov-fail-under=70

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    gui: marks tests as GUI tests
    platform: marks tests as platform-specific

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning