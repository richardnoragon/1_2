[tool:pytest]
# Pytest configuration for metrics_service comprehensive testing
# Generated: 2025-08-30

minversion = 6.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=metrics_service
    --cov-report=html:coverage_metrics_service_2025-08-30
    --cov-report=json:result_metrics_service_2025-08-30.json
    --cov-report=term-missing
    --junit-xml=result_metrics_service_2025-08-30.xml
    --html=result_metrics_service_2025-08-30.html
    --self-contained-html

# Coverage settings
[coverage:run]
source = .
branch = true
omit = 
    */tests/*
    */test_*
    */conftest.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = true
precision = 2

[coverage:html]
directory = coverage_metrics_service_2025-08-30

[coverage:json]
output = result_metrics_service_coverage_2025-08-30.json

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    parametrize: marks parametrized tests
    mock: marks tests that use mocking
    performance: marks performance tests
    edge_case: marks edge case tests
    error_handling: marks error handling tests

# Test timeout
timeout = 300

# Parallel execution
# -n auto enables parallel execution with automatic worker detection
# Uncomment the line below to enable parallel testing
# addopts = -n auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Environment variables for testing
env =
    TESTING = true
    PYTEST_CURRENT_TEST = true