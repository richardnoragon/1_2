[tool:pytest]
# Pytest configuration for miner.py unit tests
# Date: 2025-08-30
# Target: test_miner_2025-08-30.py

minversion = 6.0
testpaths = .
python_files = test_miner_2025-08-30.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    miner: Tests for miner.py module
    gui: Tests requiring GUI components
    pdf_tools: Tests for PDF processing tools
    unit_test: Unit test classification
    date_2025_08_30: Tests created on 2025-08-30
    slow: Tests that take significant time
    integration: Integration tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --junit-xml=result_miner_2025-08-30.xml
    --html=result_miner_2025-08-30.html
    --self-contained-html
    --cov=miner
    --cov-report=html:coverage_miner_2025-08-30
    --cov-report=json:result_miner_coverage_2025-08-30.json
    --cov-report=term-missing
    --cov-fail-under=80

# Logging
log_level = INFO
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
collect_ignore = []

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:PyQt5.*

# Timeout settings (if pytest-timeout is installed)
timeout = 300
timeout_method = thread

# Coverage settings
[coverage:run]
source = .
omit = 
    */venv/*
    */test_*
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    pass

precision = 2
show_missing = True

[coverage:html]
directory = coverage_miner_2025-08-30
title = Coverage Report for miner.py Tests - 2025-08-30

[coverage:json]
output = result_miner_coverage_2025-08-30.json
pretty_print = true