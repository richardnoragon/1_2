[tool:pytest]
# Pytest configuration for extract_links.py testing
# Configuration file: pytest_extract_links_2025-08-24.ini
# Created: 2025-08-24
# Target: Comprehensive testing of extract_links.py functionality

# Test discovery
testpaths = .
python_files = test_extract_links_2025-08-24.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ui: marks tests as UI tests
    mock: marks tests that use mocking extensively

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=extract_links
    --cov-report=html:result_extract_links_coverage_2025-08-24
    --cov-report=json:result_extract_links_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-fail-under=80
    --html=result_extract_links_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_extract_links_2025-08-24.json
    --json-report-summary
    --junit-xml=result_extract_links_2025-08-24_junit.xml

# Coverage settings
[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = result_extract_links_coverage_2025-08-24
title = Extract Links Coverage Report 2025-08-24

[coverage:json]
output = result_extract_links_coverage_2025-08-24.json
pretty_print = true

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/test_extract_links_2025-08-24.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test timeout (in seconds)
timeout = 300

# Minimum version requirements
minversion = 6.0

# Collect ignore
collect_ignore = [
    "setup.py",
    "build",
    "dist",
    ".tox",
    ".eggs"
]

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*QApplication.*:UserWarning

# Test ordering
# Run unit tests before integration tests