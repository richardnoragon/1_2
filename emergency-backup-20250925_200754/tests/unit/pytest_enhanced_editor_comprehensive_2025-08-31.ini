[tool:pytest]
# Pytest configuration for Enhanced Editor comprehensive testing
# Created: 2025-08-31
# Target: enhanced_editor.py

# Test discovery
testpaths = .
python_files = test_enhanced_editor_2025-08-31.py
python_classes = Test*
python_functions = test_*

# Output format
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --maxfail=0
    
# HTML and JUnit reporting
addopts = 
    --html=results/result_enhanced_editor_comprehensive_2025-08-31_report.html
    --self-contained-html
    --junitxml=results/result_enhanced_editor_comprehensive_2025-08-31_junit.xml
    --json-report
    --json-report-file=results/result_enhanced_editor_comprehensive_2025-08-31_results.json

# Coverage configuration
addopts = 
    --cov=enhanced_editor
    --cov-report=html:results/result_enhanced_editor_comprehensive_2025-08-31_coverage/
    --cov-report=json:results/result_enhanced_editor_comprehensive_2025-08-31_coverage.json
    --cov-report=term-missing
    --cov-fail-under=85
    --cov-branch

# Markers
markers =
    gui: Tests that require GUI components
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Tests that take longer to execute
    fast: Quick tests that run fast
    mock: Tests that use extensive mocking
    edge_case: Tests for edge cases and error conditions
    regression: Regression tests for known issues
    performance: Performance-related tests
    compatibility: Compatibility tests across platforms

# Test timeout
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore:.*Qt.*:UserWarning

# Minimum Python version
minversion = 3.7

# Test directories to ignore
norecursedirs = 
    .git 
    .tox 
    dist 
    build 
    __pycache__
    .pytest_cache
    *.egg

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console output
console_output_style = progress

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL

# Collect all python files in current directory
collect_ignore = [
    "setup.py",
    "conftest_*.py"
]

# Parallel execution settings
addopts = -n auto

# Required plugins
required_plugins = 
    pytest-html>=3.0.0
    pytest-cov>=4.0.0
    pytest-json-report>=1.5.0
    pytest-timeout>=2.1.0
    pytest-mock>=3.10.0
    pytest-qt>=4.0.0

# Environment variables for testing
env = 
    PYTEST_CURRENT_TEST = {nodeid}
    QT_QPA_PLATFORM = offscreen
    QT_LOGGING_RULES = qt.qpa.xcb=false

# Test result summary
summary_stats = true

# Cache directory
cache_dir = .pytest_cache

# Performance tracking
profile_svg = results/result_enhanced_editor_comprehensive_2025-08-31_profile.svg

[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */.*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = results/result_enhanced_editor_comprehensive_2025-08-31_coverage

[coverage:json]
output = results/result_enhanced_editor_comprehensive_2025-08-31_coverage.json