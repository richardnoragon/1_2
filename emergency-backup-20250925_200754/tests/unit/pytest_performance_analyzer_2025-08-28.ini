[tool:pytest]
# Pytest configuration for performance_analyzer tests

minversion = 6.0
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --html=result_performance_analyzer_html_report_2025-08-28.html
    --self-contained-html
    --json-report
    --json-report-file=result_performance_analyzer_json_report_2025-08-28.json
    --cov=performance_analyzer
    --cov-report=html:result_performance_analyzer_coverage_2025-08-28
    --cov-report=json:result_performance_analyzer_coverage_2025-08-28.json
    --cov-report=term-missing
    --durations=10

testpaths = 
    tests/unit

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests  
    performance_analyzer: Performance analyzer specific tests
    slow: Slow running tests
    network: Network related tests

# Coverage settings
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = result_performance_analyzer_coverage_2025-08-28

[coverage:json]
output = result_performance_analyzer_coverage_2025-08-28.json