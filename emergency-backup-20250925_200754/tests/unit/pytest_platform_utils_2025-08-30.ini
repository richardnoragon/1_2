[tool:pytest]
# Pytest configuration for platform_utils.py testing
# Generated on: 2025-08-30

# Test discovery
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --html=C:\Users\richardi\1_2\tests\unit\result_platform_utils_2025-08-30.html
    --self-contained-html
    --json-report
    --json-report-file=C:\Users\richardi\1_2\tests\unit\result_platform_utils_2025-08-30.json
    --cov=src.utilities.privacy.privacy_tools.core.platform_utils
    --cov-report=html:C:\Users\richardi\1_2\tests\unit\result_platform_utils_coverage_2025-08-30
    --cov-report=term-missing
    --cov-report=json:C:\Users\richardi\1_2\tests\unit\result_platform_utils_coverage_2025-08-30.json
    --durations=10
    --capture=no

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    windows: marks tests that only run on Windows
    linux: marks tests that only run on Linux
    macos: marks tests that only run on macOS

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
[coverage:run]
source = src/utilities/privacy/privacy_tools/core/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod