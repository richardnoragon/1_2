[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --tb=short
    --cov=view
    --cov-report=html:result_pdf_view_analysis_coverage_2025-08-30/
    --cov-report=json:result_pdf_view_analysis_coverage_2025-08-30.json
    --cov-report=term-missing
    --cov-fail-under=75
    --junit-xml=result_pdf_view_analysis_2025-08-30_junit.xml
    --html=result_pdf_view_analysis_2025-08-30_report.html
    --self-contained-html

testpaths = 
    .

python_files = test_pdf_view_analysis_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    pdf: PDF related tests
    ui: User interface tests
    config: Configuration tests
    navigation: Page navigation tests
    error: Error handling tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.pytest_cache/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = result_pdf_view_analysis_coverage_2025-08-30/

[coverage:json]
output = result_pdf_view_analysis_coverage_2025-08-30.json