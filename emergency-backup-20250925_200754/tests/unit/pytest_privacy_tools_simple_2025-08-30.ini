[tool:pytest]
minversion = 6.0
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src.utilities.privacy.privacy_tools_simple
    --cov-report=html:C:/Users/richardi/1_2/tests/unit/result_privacy_tools_simple_coverage_2025-08-30.html
    --cov-report=json:C:/Users/richardi/1_2/tests/unit/result_privacy_tools_simple_coverage_2025-08-30.json
    --cov-report=term-missing
    --html=C:/Users/richardi/1_2/tests/unit/result_privacy_tools_simple_report_2025-08-30.html
    --self-contained-html
    --junitxml=C:/Users/richardi/1_2/tests/unit/result_privacy_tools_simple_junit_2025-08-30.xml
    --json-report
    --json-report-file=C:/Users/richardi/1_2/tests/unit/result_privacy_tools_simple_json_2025-08-30.json

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests as GUI tests requiring PyQt5
    performance: marks tests as performance tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = C:/Users/richardi/1_2/tests/unit/result_privacy_tools_simple_pytest_2025-08-30.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Disable cacheprovider for fresh test runs
cache_dir = .pytest_cache