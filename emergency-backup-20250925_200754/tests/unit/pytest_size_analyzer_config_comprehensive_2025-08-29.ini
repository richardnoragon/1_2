[tool:pytest]
minversion = 6.0
addopts = 
    -ra 
    -q 
    --strict-markers 
    --strict-config 
    --cov=src.utilities.analysis.config.size_analyzer_config 
    --cov-report=html:coverage_size_analyzer_config_2025-08-29/
    --cov-report=json:coverage_size_analyzer_config_2025-08-29.json
    --cov-report=term-missing
    --cov-fail-under=85
    --html=result_size_analyzer_config_2025-08-29_report.html
    --self-contained-html
    --json-report
    --json-report-file=result_size_analyzer_config_2025-08-29.json
    --junitxml=result_size_analyzer_config_2025-08-29_junit.xml
    --durations=10
    --tb=short
    --maxfail=5
testpaths = 
    .
python_files = test_size_analyzer_config_comprehensive_2025-08-29.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    edge_case: marks tests as edge case tests
    error_handling: marks tests as error handling tests
    mock: marks tests that use mocking
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
cache_dir = .pytest_cache_size_analyzer_config_2025-08-29