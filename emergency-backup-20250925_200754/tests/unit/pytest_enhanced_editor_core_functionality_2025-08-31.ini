[tool:pytest]
# Enhanced Editor Core Functionality Test Configuration
# Created: 2025-08-31
# Target: enhanced_editor.py core functionality testing

minversion = 6.0
testpaths = 
    tests/unit
    .

python_files = 
    test_enhanced_editor_core_functionality_*.py
    test_enhanced_editor_core_*.py

python_classes = 
    Test*
    *Test
    *Tests

python_functions = 
    test_*

addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --color=yes
    --durations=10
    --maxfail=5
    --disable-warnings
    --show-capture=no
    -x

# Test output configuration
markers =
    unit: Core unit tests for individual components
    integration: Integration tests between components
    performance: Performance and stress tests
    gui: PyQt5 GUI component tests
    mock: Tests using mocked dependencies
    edge_case: Edge case and error handling tests
    file_ops: File operation tests
    search: Search and replace functionality tests
    slow: Tests that take longer to execute

# Coverage configuration
addopts = 
    --cov=enhanced_editor
    --cov-report=html:results/result_enhanced_editor_core_functionality_2025-08-31_coverage/
    --cov-report=json:results/result_enhanced_editor_core_functionality_2025-08-31_coverage.json
    --cov-report=term-missing:skip-covered
    --cov-fail-under=75
    --cov-branch

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = results/result_enhanced_editor_core_functionality_2025-08-31_pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test execution configuration
timeout = 300
timeout_method = thread

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*QApplication.*:RuntimeWarning
    ignore:.*Qt.*:RuntimeWarning

# Environment variables for testing
env = 
    QT_QPA_PLATFORM=offscreen
    QT_LOGGING_RULES=qt.qpa.xcb=false
    PYTEST_CURRENT_TEST=enhanced_editor_core_functionality
    PYTHONPATH=src/utilities/file_operations/enhanced_editor

# JSON report configuration
json_report = results/result_enhanced_editor_core_functionality_2025-08-31_results.json
jsonapi = true

# HTML report configuration  
htmlpath = results/result_enhanced_editor_core_functionality_2025-08-31_report.html

# JUnit XML configuration
junit_xml = results/result_enhanced_editor_core_functionality_2025-08-31_junit.xml
junit_suite_name = enhanced_editor_core_functionality_tests
junit_logging = all
junit_log_passing_tests = true
junit_duration_report = total

# PyQt5 specific configuration
qt_api = pyqt5
qt_no_exception_capture = 1

# Mock configuration  
mock_use_standalone_module = true