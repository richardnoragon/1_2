[tool:pytest]
# Pytest Configuration for Network GUI Tests
# Test execution timestamp: 2025-08-28
# Target: network\gui.py

# Test discovery
testpaths = .
python_files = test_network_gui_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    gui: GUI-related tests
    network: Network functionality tests
    slow: Slow-running tests

# Reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --cov=src.utilities.network.gui
    --cov-report=html:coverage_network_gui_2025-08-28/
    --cov-report=json:result_network_gui_coverage_2025-08-28.json
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=85
    --html=result_network_gui_2025-08-28.html
    --self-contained-html
    --junitxml=result_network_gui_2025-08-28.xml
    --json-report
    --json-report-file=result_network_gui_2025-08-28.json

# Timeout settings
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning
    ignore::UserWarning:pyqt5.*
    ignore::ResourceWarning

# PyQt5 specific settings
qt_api = pyqt5
qt_timeout = 10000

# Coverage settings
[coverage:run]
source = src/utilities/network/gui
branch = true
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = coverage_network_gui_2025-08-28/
title = Network GUI Test Coverage Report - 2025-08-28

[coverage:json]
output = result_network_gui_coverage_2025-08-28.json
pretty_print = true