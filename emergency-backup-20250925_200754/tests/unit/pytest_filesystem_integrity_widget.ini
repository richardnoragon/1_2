[tool:pytest]
# pytest configuration for filesystem_integrity_widget tests
# Generated: 2025-08-29

# Test discovery
testpaths = tests/unit
python_files = test_filesystem_integrity_widget_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=0
    --capture=no
    --html=tests/unit/result_filesystem_integrity_widget_2025-08-29.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_filesystem_integrity_widget_2025-08-29.json
    --cov=src/utilities/system/diagnostics_monitoring/gui/filesystem_integrity_widget
    --cov-report=html:tests/unit/result_filesystem_integrity_widget_coverage_2025-08-29
    --cov-report=xml:tests/unit/result_filesystem_integrity_widget_coverage_2025-08-29.xml
    --cov-report=term-missing

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    gui: Tests requiring GUI components

# Minimum version
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning