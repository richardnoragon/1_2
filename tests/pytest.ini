[tool:pytest]
# Test discovery
testpaths = unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=html:tests/unit/result_split_coverage_2025-08-24.html
    --cov-report=json:tests/unit/result_split_coverage_2025-08-24.json
    --cov-report=term-missing
    --html=tests/unit/result_split_test_report_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_split_test_results_2025-08-24.json
    --durations=10
    --capture=no
    -p no:pytest_lazyfixture

# Coverage settings
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = tests/unit/result_split_coverage_2025-08-24.html

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    identity: Identity workflow integration tests
    contract: Contract-level API compatibility tests
    performance: Performance envelope validation tests
    cli: CLI workflow coverage
    smoke: Smoke tests
    slow: Tests that take a long time to run
    gui: Tests that require GUI components
    pdf: Tests that work with PDF files