[tool:pytest]
# Pytest configuration for convert_html_to_pdf testing
# Created: 2025-08-24

# Test discovery patterns
python_files = test_convert_html_to_pdf_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = C:\Users\HP1\1_2\1_2\tests\unit

# Minimum pytest version
minversion = 6.0

# Add options to command line
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --html=result_convert_html_to_pdf_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_convert_html_to_pdf_2025-08-24.json
    --json-report-summary
    --cov=convert_html_to_pdf
    --cov-report=html:result_convert_html_to_pdf_coverage_2025-08-24
    --cov-report=json:result_convert_html_to_pdf_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=85
    --junitxml=result_convert_html_to_pdf_2025-08-24_junit.xml

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests
    gui: GUI-related tests
    conversion: PDF conversion tests
    error: Error handling tests
    slow: Slow running tests
    parametrize: Parametrized tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = result_convert_html_to_pdf_test_2025-08-24.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeout (in seconds)
timeout = 300

# Coverage configuration
[coverage:run]
source = src/utilities/pdf_tools/pdf_conversion
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = result_convert_html_to_pdf_coverage_2025-08-24

[coverage:json]
output = result_convert_html_to_pdf_coverage_2025-08-24.json