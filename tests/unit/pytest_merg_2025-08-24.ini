[tool:pytest]
# Pytest configuration for merg.py comprehensive testing
# Generated on August 24, 2025

# Test discovery
testpaths = .
python_files = test_merg_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --html=result_merg_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_merg_2025-08-24.json
    --cov=src.utilities.pdf_tools.pdf_basic_operations.merg
    --cov-report=html:result_merg_coverage_2025-08-24
    --cov-report=json:result_merg_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-fail-under=80
    --junit-xml=result_merg_2025-08-24_junit.xml
    --maxfail=5

# Coverage settings
[coverage:run]
source = src/utilities/pdf_tools/pdf_basic_operations/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = result_merg_coverage_2025-08-24
title = merg.py Test Coverage Report - 2025-08-24

# Test markers
markers =
    unit: Unit tests for individual functions/methods
    integration: Integration tests for component interaction
    ui: Tests requiring PyQt5 UI components
    mock: Tests using mock objects
    slow: Tests that take longer to execute
    edge_case: Edge case and error condition tests

# Minimum Python version
minversion = 6.0

# Test timeouts
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*imp module.*:DeprecationWarning

# Console output options
console_output_style = progress