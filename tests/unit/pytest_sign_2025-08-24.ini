# Pytest Configuration for PDF Sign Module Testing
# Created: 2025-08-24
# Target: sign.py comprehensive testing

[tool:pytest]
# Test discovery configuration
testpaths = tests/unit
python_files = test_sign_2025-08-24.py
python_classes = Test*
python_functions = test_*

# Minimum version requirements
minversion = 6.0

# Add project source to Python path
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src.utilities.pdf_tools.pdf_basic_operations.sign
    --cov-report=html:tests/unit/result_sign_coverage_2025-08-24/
    --cov-report=json:tests/unit/result_sign_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-fail-under=80
    --html=tests/unit/result_sign_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_sign_2025-08-24.json
    --junit-xml=tests/unit/result_sign_2025-08-24_junit.xml
    --maxfail=3

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multiple components
    gui: Tests for GUI components
    slow: Tests that take longer to execute
    certificate: Tests related to certificate generation
    pdf_signing: Tests related to PDF signing operations
    file_operations: Tests for file handling operations
    edge_cases: Tests for edge cases and error conditions

# Test output options
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = src/utilities/pdf_tools/pdf_basic_operations/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = tests/unit/result_sign_coverage_2025-08-24/
title = PDF Sign Module Test Coverage Report

[coverage:json]
output = tests/unit/result_sign_coverage_2025-08-24.json