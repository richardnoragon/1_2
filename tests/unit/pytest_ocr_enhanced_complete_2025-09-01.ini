[pytest]
testpaths = tests/unit
python_files = test_ocr_enhanced_complete_2025-09-01.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --show-capture=no --durations=10 --color=yes --html=result_ocr_enhanced_complete_2025-09-01.html --self-contained-html --json-report --json-report-file=result_ocr_enhanced_complete_2025-09-01.json
markers = 
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    security: marks tests as security tests
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*pandas.*:FutureWarning
junit_family = xunit2