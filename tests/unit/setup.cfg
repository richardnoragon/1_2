[tool:pytest]
minversion = 6.0
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --html=tests/unit/result_diagnostics_monitoring_2025-08-27.html
    --self-contained-html
    --json-report
    --json-report-file=tests/unit/result_diagnostics_monitoring_2025-08-27.json
    --cov=src.tools.system.diagnostics_monitoring
    --cov-report=html:tests/unit/result_diagnostics_monitoring_coverage_2025-08-27
    --cov-report=term-missing
    --cov-report=json:tests/unit/result_diagnostics_monitoring_coverage_2025-08-27.json
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning