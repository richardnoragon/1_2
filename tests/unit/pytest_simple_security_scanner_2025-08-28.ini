[tool:pytest]
# Pytest configuration for security_scanner.py unit tests
# Generated: 2025-08-28

minversion = 6.0
addopts = 
    -ra 
    -q 
    --strict-markers 
    --strict-config 
    --cov=tools.security.security_scanner.security_scanner 
    --cov-report=html:tests/unit/result_simple_security_scanner_coverage_2025-08-28
    --cov-report=json:tests/unit/result_simple_security_scanner_coverage_2025-08-28.json
    --cov-report=xml:tests/unit/result_simple_security_scanner_coverage_2025-08-28.xml
    --cov-report=term-missing
    --html=tests/unit/result_simple_security_scanner_report_2025-08-28.html
    --self-contained-html
    --junitxml=tests/unit/result_simple_security_scanner_junit_2025-08-28.xml
    --tb=short
    -v

testpaths = 
    tests/unit

python_files = test_simple_security_scanner_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    security: marks tests as security-related tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning
    ignore:.*PyQt5.*:UserWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

[coverage:run]
source = tools.security.security_scanner
branch = true
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */backup/*
    */archive/*
    */build/*
    */dist/*
    */.git/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
    except ImportError:
    except ModuleNotFoundError:

precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = tests/unit/result_simple_security_scanner_coverage_2025-08-28
title = Simple Security Scanner Unit Test Coverage Report - Generated 2025-08-28

[coverage:xml]
output = tests/unit/result_simple_security_scanner_coverage_2025-08-28.xml

[coverage:json]
output = tests/unit/result_simple_security_scanner_coverage_2025-08-28.json
pretty_print = true