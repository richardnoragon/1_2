# pytest configuration for battery_health_widget tests
# Generated: 2025-08-29

[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=result_battery_health_widget_2025-08-29_report.html
    --self-contained-html
    --junitxml=result_battery_health_widget_2025-08-29_junit.xml

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Slow running tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning