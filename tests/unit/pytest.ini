[tool:pytest]
# Pytest configuration for Size Analyzer comprehensive testing
# Generated on August 22, 2025

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short

# Minimum Python version
minversion = 6.0

# Test timeouts
timeout = 300