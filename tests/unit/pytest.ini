[tool:pytest]
# Pytest configuration for comprehensive testing including convert_to_image.py
# Updated on August 24, 2025

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --html=result_convert_to_image_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_convert_to_image_2025-08-24.json
    --cov=convert_to_image
    --cov-report=html:result_convert_to_image_coverage_2025-08-24
    --cov-report=json:result_convert_to_image_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-branch

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    pdf_tools: PDF tools related tests
    slow: Slow running tests
    gui: GUI related tests

# Minimum Python version
minversion = 6.0

# Test timeouts
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning