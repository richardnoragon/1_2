[tool:pytest]
# pytest configuration for disk_health_widget.py tests
# Configuration file: pytest_disk_health_widget_2025-08-29.ini
# Created: 2025-08-29
# Target: Comprehensive testing of disk_health_widget.py

# Test discovery
testpaths = c:\Users\richardi\1_2\tests\unit
python_files = test_disk_health_widget_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes

# HTML reporting
--html=c:\Users\richardi\1_2\tests\unit\result_disk_health_widget_pytest_report_2025-08-29.html
--self-contained-html

# JUnit XML reporting  
--junitxml=c:\Users\richardi\1_2\tests\unit\result_disk_health_widget_junit_2025-08-29.xml

# JSON reporting
--json-report
--json-report-file=c:\Users\richardi\1_2\tests\unit\result_disk_health_widget_json_report_2025-08-29.json
--json-report-summary

# Coverage reporting
--cov=src.tools.system.diagnostics_monitoring.gui.disk_health_widget
--cov-report=html:c:\Users\richardi\1_2\tests\unit\result_disk_health_widget_coverage_2025-08-29
--cov-report=xml:c:\Users\richardi\1_2\tests\unit\result_disk_health_widget_coverage_2025-08-29.xml
--cov-report=term-missing
--cov-fail-under=80

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests  
    mock: Tests using mocks
    gui: GUI component tests
    performance: Performance tests
    edge_case: Edge case and boundary tests
    error_handling: Error handling tests
    data_flow: Data flow tests
    lifecycle: Widget lifecycle tests
    slow: Slow running tests

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Collection
collect_ignore = [
    "setup.py",
    "build",
    "dist"
]

# Cache
cache_dir = c:\Users\richardi\1_2\tests\unit\.pytest_cache

# Temporary directory
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"

# Test execution
usefixtures = 
maxfail = 10
tb = short