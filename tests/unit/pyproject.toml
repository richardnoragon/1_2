# Pytest Configuration for en_and_decrypt.py Unit Tests
# Generated: 2025-08-28

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output formatting and reporting
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers", 
    "--strict-config",
    "--capture=no",
    "--color=yes",
    "--durations=10",
    "--html=tests/unit/result_en_and_decrypt_2025-08-28.html",
    "--self-contained-html",
    "--junitxml=tests/unit/result_en_and_decrypt_2025-08-28.xml"
]

# Test markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests", 
    "unit: marks tests as unit tests",
    "security: marks tests as security-related",
    "ui: marks tests as UI-related",
    "encryption: marks tests as encryption-related"
]

# Warning filters
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning", 
    "ignore::PendingDeprecationWarning"
]

# Console output
console_output_style = "progress"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Test timeout (in seconds)
timeout = 300

# Performance settings
maxfail = 5