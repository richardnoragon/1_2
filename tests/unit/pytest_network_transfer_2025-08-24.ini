# pytest configuration for Network Transfer module unit tests
# Created: 2025-08-24
# Target: test_network_transfer_2025-08-24.py

[tool:pytest]
# Test discovery
testpaths = .
python_files = test_network_transfer_2025-08-24.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --maxfail=5
    --durations=10
    --cov=src.tools.network.transfer.network_transfer
    --cov-report=html:result_network_transfer_coverage_2025-08-24
    --cov-report=json:result_network_transfer_coverage_2025-08-24.json
    --cov-report=term-missing
    --cov-fail-under=80
    --html=result_network_transfer_2025-08-24.html
    --self-contained-html
    --json-report
    --json-report-file=result_network_transfer_2025-08-24.json
    --junit-xml=result_network_transfer_2025-08-24_junit.xml

# Markers
markers =
    unit: Unit tests
    security: Security-focused tests
    integration: Integration tests
    gui: GUI tests
    network: Network functionality tests
    encryption: Encryption and security tests
    pathsec: Path security tests
    protocol: Protocol tests
    slow: Slow running tests
    skip_ci: Skip in continuous integration

# Minimum version requirements
minversion = 6.0

# Test collection configuration
collect_ignore = [
    "setup.py",
    "__pycache__",
    ".pytest_cache",
    "htmlcov",
    "result_*"
]

# Filterwarnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*PyQt5.*:DeprecationWarning
    ignore:.*cryptography.*:CryptographyDeprecationWarning

# Coverage configuration
[coverage:run]
source = src.tools.network.transfer.network_transfer
branch = true
omit = 
    tests/*
    */__pycache__/*
    */site-packages/*
    */.venv/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = result_network_transfer_coverage_2025-08-24
title = Network Transfer Module Coverage Report 2025-08-24

[coverage:json]
output = result_network_transfer_coverage_2025-08-24.json
pretty_print = true

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = result_network_transfer_test_log_2025-08-24.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout configuration
timeout = 300
timeout_method = thread
